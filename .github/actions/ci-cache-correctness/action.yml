name: KV cache correctness
description: Run the complete correctness sequence for one pinned KV fixture.
inputs:
  backend:
    description: Cache qualification profile
    required: true
  fixture:
    description: Pinned KV architecture case
    required: true
  candidate_artifact:
    description: Protected candidate source artifact
    default: ''
  candidate_sha:
    description: Immutable candidate source revision
    default: ''
runs:
  using: composite
  steps:
    - uses: ./.github/actions/cache
    - uses: ./.github/actions/source
      with:
        artifact: ${{ inputs.candidate_artifact }}
        sha: ${{ inputs.candidate_sha }}
    - uses: ./.github/actions/setup-hf
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ env.SKIPPY_ARTIFACT_SCOPE }}-kv-binaries-${{ inputs.backend }}
        path: target/cache-qualification-binaries
    - name: Run the cache correctness case
      shell: bash
      env:
        BACKEND: ${{ inputs.backend }}
        FIXTURE: ${{ inputs.fixture }}
      run: just cache-correctness-shard "$BACKEND" "$FIXTURE" target/cache-qualification-binaries target/cache-qualification-results
    - name: Retain the case evidence
      if: always()
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      with:
        name: ${{ env.SKIPPY_ARTIFACT_SCOPE }}-kv-shard-${{ inputs.backend }}-${{ inputs.fixture }}
        path: |
          target/cache-qualification-results/batch-result.json
          target/cache-qualification-results/*/*.json
          target/cache-qualification-results/*/*.log
          target/cache-qualification-results/*/template-identity/*.log
        if-no-files-found: error
        overwrite: true
        retention-days: 14
