name: KV cache correctness
description: Run the four pinned KV architecture fixtures on the selected backend.
inputs:
  backend:
    description: Cache qualification profile
    required: true
  candidate_artifact:
    description: Protected candidate source artifact
    default: ''
  candidate_sha:
    description: Immutable candidate source revision
    default: ''
runs:
  using: composite
  steps:
    - uses: ./.github/actions/cache
    - uses: ./.github/actions/sccache
      with:
        scope: cache-correctness-${{ inputs.backend }}
    - uses: ./.github/actions/source
      with:
        artifact: ${{ inputs.candidate_artifact }}
        sha: ${{ inputs.candidate_sha }}
    - uses: ./.github/actions/setup-hf
    - name: Identify pinned reference build inputs
      id: reference
      shell: bash
      env:
        BACKEND: ${{ inputs.backend }}
      run: |
        fingerprint() {
          set -e
          uname -r
          c++ --version
          cmake --version
          if [[ "$BACKEND" == cuda-arm64 ]]; then
            nvcc --version
            nvidia-smi --query-gpu=compute_cap --format=csv,noheader
          else
            xcrun --show-sdk-version
          fi
        }
        set -o pipefail
        digest=$(fingerprint | git hash-object --stdin)
        echo "toolchain=$digest" >> "$GITHUB_OUTPUT"
    - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      id: reference-cache
      with:
        path: target/cache-qualification-reference/llama-server
        key: kv-reference-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.backend }}-${{ steps.reference.outputs.toolchain }}-${{ hashFiles('llama_cpp/upstream.txt', 'Justfile', 'tools/xtask/src/cache_qualification/prepare.rs') }}
    - name: Run the cache correctness matrix
      shell: bash
      env:
        BACKEND: ${{ inputs.backend }}
        CMAKE_BUILD_PARALLEL_LEVEL: '8'
      run: |
        reference="$GITHUB_WORKSPACE/target/cache-qualification-reference/llama-server"
        if [[ -x "$reference" ]]; then
          export SKIPPY_CACHE_QUAL_LLAMA_SERVER="$reference"
        fi
        just cache-correctness-matrix "$BACKEND" target/cache-qualification-results --build --hf
    - name: Stage the built reference for future runs
      id: stage-reference
      if: always() && steps.reference-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        built=target/cache-qualification-results/reference-build/bin/llama-server
        if [[ -x "$built" ]]; then
          mkdir -p target/cache-qualification-reference
          cp "$built" target/cache-qualification-reference/llama-server
          echo 'available=true' >> "$GITHUB_OUTPUT"
        fi
    - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      if: always() && steps.stage-reference.outputs.available == 'true'
      with:
        path: target/cache-qualification-reference/llama-server
        key: ${{ steps.reference-cache.outputs.cache-primary-key }}
    - name: Retain cache correctness evidence
      if: always()
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      with:
        name: ${{ env.SKIPPY_ARTIFACT_SCOPE }}-cache-correctness-${{ inputs.backend }}
        path: |
          target/cache-qualification-results/batch-result.json
          target/cache-qualification-results/*/*.json
          target/cache-qualification-results/*/*.log
          target/cache-qualification-results/*/template-identity/*.log
          target/cache-qualification-results/reference-build/CMakeFiles/CMakeConfigureLog.yaml
          .deps/llama-build/**/CMakeFiles/CMakeConfigureLog.yaml
        if-no-files-found: error
        retention-days: 14
