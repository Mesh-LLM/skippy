name: Restore Skippy build caches
description: Share dependency downloads and restore source-versioned Cargo build snapshots.
inputs:
  scope:
    description: Compatible job role, platform target and backend for build outputs.
    default: tools
  build-paths:
    description: Only the Cargo output directories used by this job.
    default: target/debug
  download-scope:
    description: Compatible dependency set; prevents a tools-only cache from freezing an incomplete product cache.
    default: tools
runs:
  using: composite
  steps:
    - name: Configure bounded compiler caching
      shell: bash
      run: |
        echo "SCCACHE_DIR=$HOME/.cache/sccache" >> "$GITHUB_ENV"
        echo "SCCACHE_BASEDIRS=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
        echo 'SCCACHE_CACHE_SIZE=5G' >> "$GITHUB_ENV"
    - name: Restore shared Cargo downloads
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: cargo-downloads-v1-${{ runner.os }}-${{ inputs.download-scope }}-${{ hashFiles('Cargo.lock', 'skippy-api-rs/Cargo.lock') }}
        restore-keys: |
          cargo-downloads-v1-${{ runner.os }}-${{ inputs.download-scope }}-
    - name: Identify checked-out source
      id: source
      shell: bash
      run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
    - name: Restore rolling Cargo build snapshot
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ inputs.build-paths }}
        key: cargo-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.scope }}-${{ env.CARGO_INCREMENTAL }}-${{ env.CARGO_PROFILE_DEV_DEBUG }}-${{ env.CARGO_PROFILE_TEST_DEBUG }}-${{ env.CARGO_PROFILE_RELEASE_DEBUG }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.toml', 'Cargo.lock', 'skippy-api-rs/Cargo.toml', 'skippy-api-rs/Cargo.lock', '.cargo/config.toml', 'Justfile', 'scripts/**', 'llama_cpp/upstream.txt', 'llama_cpp/whisper-upstream.txt', 'llama_cpp/patches/**', 'ci/targets.json') }}-${{ steps.source.outputs.sha }}
        restore-keys: |
          cargo-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.scope }}-${{ env.CARGO_INCREMENTAL }}-${{ env.CARGO_PROFILE_DEV_DEBUG }}-${{ env.CARGO_PROFILE_TEST_DEBUG }}-${{ env.CARGO_PROFILE_RELEASE_DEBUG }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.toml', 'Cargo.lock', 'skippy-api-rs/Cargo.toml', 'skippy-api-rs/Cargo.lock', '.cargo/config.toml', 'Justfile', 'scripts/**', 'llama_cpp/upstream.txt', 'llama_cpp/whisper-upstream.txt', 'llama_cpp/patches/**', 'ci/targets.json') }}-
