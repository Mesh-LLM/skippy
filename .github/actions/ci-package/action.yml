name: Build, package and smoke Skippy
description: Produce and verify one runtime package, using a source-bound CLI from the same platform.
inputs:
  runtime-id:
    description: Runtime from ci/targets.json.
    required: true
  host-id:
    description: Platform that produces the shared CLI.
    required: true
  build-cli:
    description: Build the CLI locally instead of downloading the platform producer artifact.
    default: 'false'
  setup-host:
    description: Install the pinned command runner on a standard runner image.
    default: 'false'
  smoke:
    description: Select inference or artifact smoke.
    default: inference
  windows-cuda:
    description: Pinned CUDA toolkit version to provision on the hosted Windows builder.
    default: ''
  windows-rocm:
    description: Pinned ROCm version whose HIP SDK is provisioned on the hosted Windows builder.
    default: ''
  containerized:
    description: Use the preinstalled toolchain in a Skippy compiler image.
    default: 'false'
  compiler-image-digest:
    description: Digest used to start the compiler container, empty on native runners.
    default: ''
  candidate-artifact:
    description: Immutable candidate source artifact.
    default: ''
  candidate-sha:
    description: Immutable candidate source revision.
    default: ''
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup
      if: inputs.setup-host == 'true'
      with:
        cache: 'false'
    - name: Prefer Git Bash for Windows build scripts
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $gitRoot = Split-Path (Split-Path (Get-Command git.exe).Source)
        Join-Path $gitRoot 'bin' | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
        'SKIPPY_PYTHON=python' | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
    # CMake, Ninja, nvcc, and the HIP compilers need the MSVC tools on PATH;
    # rustc locates Visual Studio itself, the native stage does not.
    - name: Enable the MSVC developer environment
      if: runner.os == 'Windows'
      shell: pwsh
      run: ./scripts/enable-msvc-dev-env.ps1
    - name: Identify the compiler image
      if: inputs.containerized == 'true'
      shell: bash
      run: |
        image_id="$(cat /etc/skippy-ci-image-id)"
        test -n "$image_id"
        echo "SKIPPY_TOOLCHAIN_CACHE_KEY=$image_id" >> "$GITHUB_ENV"
    - uses: ./.github/actions/source
      with:
        artifact: ${{ inputs.candidate-artifact }}
        sha: ${{ inputs.candidate-sha }}
    - name: Provision NVIDIA CUDA on Windows
      if: inputs.windows-cuda != ''
      shell: bash
      env:
        CUDA_VERSION: ${{ inputs.windows-cuda }}
      run: |
        "$SKIPPY_PYTHON" scripts/ci-windows-cuda.py "$CUDA_VERSION"
    - name: Provision AMD HIP SDK on Windows
      if: inputs.windows-rocm != ''
      shell: pwsh
      env:
        ROCM_VERSION: ${{ inputs.windows-rocm }}
      run: ./scripts/install-windows-rocm-sdk.ps1 -ExpectedVersion "$env:ROCM_VERSION"
    - name: Provision the Linux ROCm BLAS libraries
      if: inputs.runtime-id == 'linux-x86_64-rocm'
      shell: bash
      run: bash scripts/ci-rocm-blas.sh
    - uses: ./.github/actions/cache
      with:
        scope: package-${{ inputs.runtime-id }}-${{ inputs.compiler-image-digest || inputs.windows-cuda || inputs.windows-rocm || env.SKIPPY_TOOLCHAIN_CACHE_KEY || 'native' }}
        download-scope: ${{ inputs.build-cli == 'true' && 'host' || 'tools' }}
        build-paths: |
          target/debug
          target/release
    - name: Identify the Windows CUDA compiler cache
      id: cuda-cache
      if: runner.os == 'Windows' && inputs.windows-cuda != '' && inputs.smoke == 'artifact' && inputs.build-cli != 'true'
      shell: bash
      env:
        RUNTIME_ID: ${{ inputs.runtime-id }}
        CUDA_VERSION: ${{ inputs.windows-cuda }}
      run: |
        if namespace=$(bash scripts/ci-windows-cuda-cache.sh "$RUNTIME_ID" "$CUDA_VERSION"); then
          echo "namespace=$namespace" >> "$GITHUB_OUTPUT"
        else
          echo "::warning::Could not identify the native CUDA cache. Using the standard compiler cache."
        fi
    - uses: ./.github/actions/sccache
      with:
        scope: package-${{ inputs.runtime-id }}-${{ inputs.windows-cuda || inputs.windows-rocm || env.SKIPPY_TOOLCHAIN_CACHE_KEY || 'native' }}-${{ env.SKIPPY_CUDA_ARCHITECTURE_MODE }}
        native-windows-cuda-namespace: ${{ steps.cuda-cache.outputs.namespace }}
    - uses: ./.github/actions/native-source
    - name: Build and verify the platform CLI
      if: inputs.build-cli == 'true'
      shell: bash
      env:
        HOST_ID: ${{ inputs.host-id }}
      run: just ci-host "$HOST_ID"
    - name: Upload the shared CLI for full CI
      if: inputs.build-cli == 'true' && env.SKIPPY_CI_PROFILE == 'full'
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      with:
        name: ${{ env.SKIPPY_ARTIFACT_SCOPE }}-host-${{ inputs.host-id }}
        path: dist/hosts/${{ inputs.host-id }}
        if-no-files-found: error
        compression-level: 0
        overwrite: true
        retention-days: 7
    - name: Download the verified platform CLI
      if: inputs.build-cli != 'true'
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ env.SKIPPY_ARTIFACT_SCOPE }}-host-${{ inputs.host-id }}
        path: dist/hosts/${{ inputs.host-id }}
    - name: Build and package the runtime
      shell: bash
      env:
        HOST_ID: ${{ inputs.host-id }}
        RUNTIME_ID: ${{ inputs.runtime-id }}
        SMOKE_MODE: ${{ inputs.smoke }}
      run: |
        case "$SMOKE_MODE" in
          inference) ;;
          artifact) export SKIPPY_CUDA_ARCHITECTURE_MODE=release ;;
          *) echo "Invalid smoke mode: $SMOKE_MODE" >&2; exit 1 ;;
        esac
        just ci-runtime "$RUNTIME_ID"
        just ci-package "$RUNTIME_ID" "dist/hosts/$HOST_ID" "dist/runtimes/$RUNTIME_ID"
    - name: Smoke the exact packaged CLI and runtime archive
      if: inputs.smoke == 'artifact'
      shell: bash
      env:
        RUNTIME_ID: ${{ inputs.runtime-id }}
      run: just ci-artifact-smoke "$RUNTIME_ID" "dist/products/$RUNTIME_ID"
    - uses: ./.github/actions/ci-smoke
      if: inputs.smoke == 'inference'
      with:
        runtime_id: ${{ inputs.runtime-id }}
    - name: Upload tested package
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      with:
        name: ${{ env.SKIPPY_ARTIFACT_SCOPE }}-product-${{ inputs.runtime-id }}
        path: dist/products/${{ inputs.runtime-id }}
        if-no-files-found: error
        compression-level: 0
        overwrite: true
        retention-days: 7
    - uses: ./.github/actions/report-sccache
      if: ${{ !cancelled() && env.SCCACHE != '' }}
      with:
        artifact-prefix: ${{ env.SKIPPY_ARTIFACT_SCOPE }}-package-${{ inputs.runtime-id }}
    - name: Upload build and smoke failure evidence
      if: failure()
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      with:
        name: ${{ env.SKIPPY_ARTIFACT_SCOPE }}-package-${{ inputs.runtime-id }}-diagnostics
        path: |
          .deps/llama-build/**/CMakeCache.txt
          .deps/llama-build/**/CMakeFiles/CMakeConfigureLog.yaml
          .deps/llama-build/**/Testing/**
          dist/products/${{ inputs.runtime-id }}/evidence/**
        include-hidden-files: true
        if-no-files-found: ignore
        overwrite: true
        retention-days: 14
