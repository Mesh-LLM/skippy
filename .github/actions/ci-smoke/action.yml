name: Smoke qualification
description: Run the shared smoke contract for one admitted runtime.
inputs:
  runtime_id:
    description: Runtime from ci/targets.json
    required: true
  candidate_artifact:
    description: Protected candidate source artifact
    default: ''
  candidate_sha:
    description: Immutable candidate source revision
    default: ''
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup
      if: runner.environment == 'github-hosted'
      with:
        cache: 'false'
    - uses: ./.github/actions/source
      with:
        artifact: ${{ inputs.candidate_artifact }}
        sha: ${{ inputs.candidate_sha }}
    - uses: ./.github/actions/cache
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ env.SKIPPY_ARTIFACT_SCOPE }}-package-${{ inputs.runtime_id }}
        path: dist/products/${{ inputs.runtime_id }}
    - name: Restore immutable Qwen3 smoke fixture
      if: env.SKIPPY_CI_MODEL == ''
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: target/ci-models/Qwen3-0.6B-Q8_0.gguf
        key: smoke-model-v1-qwen3-dense-${{ hashFiles('ci/llama-canary/family-certified.json', 'tools/xtask/src/ci/smoke.rs') }}
    - name: Admit pinned Qwen3 fixture
      run: just automation-run ci model-fetch
      shell: bash
    - name: Execute packaged Qwen3 on the required backend
      shell: bash
      env:
        RUNTIME_ID: ${{ inputs.runtime_id }}
      run: just ci-smoke "$RUNTIME_ID" "dist/products/$RUNTIME_ID"
    - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      if: always()
      with:
        name: ${{ env.SKIPPY_ARTIFACT_SCOPE }}-product-${{ inputs.runtime_id }}
        path: dist/products/${{ inputs.runtime_id }}
        if-no-files-found: error
        retention-days: 7
