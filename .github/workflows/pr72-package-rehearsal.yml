name: PR 199 Windows CUDA cache rehearsal
on:
  push:
    branches: [rehearsal/pr-72-213b993]
permissions:
  contents: read
env:
  SKIPPY_CI_PROFILE: full
  SKIPPY_CI_SOURCE_REF: e29919f0b2643215cf6d27e98f4e580818cbb09a
  SCCACHE_GHA_ENABLED: 'true'
jobs:
  cache:
    name: Verify native cache across a version bump · ${{ matrix.runtime }}
    if: github.repository == 'Mesh-LLM/skippy' && github.ref == 'refs/heads/rehearsal/pr-72-213b993'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: windows-x86_64-cuda12
            version: '12.9.2'
            runner: windows-2022
          - runtime: windows-x86_64-cuda13
            version: '13.1.2'
            runner: depot-windows-2022-8
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CUDA_VERSION: ${{ matrix.version }}
      RUNTIME_ID: ${{ matrix.runtime }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.SKIPPY_CI_SOURCE_REF }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache: 'false'
      - name: Select Git Bash and Python
        shell: pwsh
        run: |
          $gitRoot = Split-Path (Split-Path (Get-Command git.exe).Source)
          Join-Path $gitRoot 'bin' | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          'SKIPPY_PYTHON=python' | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Enable MSVC
        shell: pwsh
        run: ./scripts/enable-msvc-dev-env.ps1
      - name: Install the package job's pinned CUDA SDK
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$SKIPPY_CI_SOURCE_REF"
          "$SKIPPY_PYTHON" scripts/ci-windows-cuda.py "$CUDA_VERSION"
      - name: Derive the production native namespace
        id: cache-key
        shell: bash
        env:
          SKIPPY_CUDA_ARCHITECTURE_MODE: native
        run: |
          key=$(bash scripts/ci-windows-cuda-cache.sh "$RUNTIME_ID" "$CUDA_VERSION")
          [[ "$key" =~ ^skippy-native-windows-cuda-v1-[a-f0-9]{64}$ ]]
          printf 'namespace=%s\n' "$key" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/sccache
        with:
          scope: rehearsal-${{ matrix.runtime }}
          native-windows-cuda-namespace: ${{ steps.cache-key.outputs.namespace }}
      - name: Verify shared cache is read-only
        shell: bash
        env:
          NAMESPACE: ${{ steps.cache-key.outputs.namespace }}
          RUNNER_LABEL: ${{ matrix.runner }}
        run: |
          mkdir -p target/ci-evidence
          "$SCCACHE" --show-stats --stats-format json > target/ci-evidence/shared.json
          if [[ "$RUNNER_LABEL" == depot-* ]]; then
            test "$SCCACHE_WEBDAV_KEY_PREFIX" = "$NAMESPACE"
            test "$SCCACHE_WEBDAV_RW_MODE" = READ_ONLY
            jq -e --arg key "$NAMESPACE" '.cache_location | startswith("webdav,") and contains($key)' target/ci-evidence/shared.json
          else
            test "$SCCACHE_GHA_VERSION" = "$NAMESPACE"
            test "$SCCACHE_GHA_RW_MODE" = READ_ONLY
            jq -e '.cache_location | startswith("ghac,")' target/ci-evidence/shared.json
          fi
      - name: Require a real CUDA cache hit after staging a release version
        shell: bash
        env:
          NAMESPACE: ${{ steps.cache-key.outputs.namespace }}
          SKIPPY_CUDA_ARCHITECTURE_MODE: release
        run: |
          set -euo pipefail
          "$SCCACHE" --stop-server
          unset SCCACHE_GHA_VERSION SCCACHE_WEBDAV_ENDPOINT SCCACHE_WEBDAV_KEY_PREFIX
          export SCCACHE_GHA_ENABLED=false
          scratch=$(mktemp -d)
          export SCCACHE_DIR
          SCCACHE_DIR=$(cygpath -m "$scratch/$NAMESPACE")
          "$SCCACHE" --start-server
          trap '"$SCCACHE" --stop-server >/dev/null 2>&1 || true' EXIT
          "$SCCACHE" --show-stats --stats-format json | jq -e '.cache_location | ascii_downcase | startswith("local")'

          arches=$(GITHUB_OUTPUT='' just ci-plan | jq -er --arg id "$RUNTIME_ID" '.runtimes.include[] | select(.id == $id).gpu_architectures')
          IFS=';' read -r -a architecture_list <<< "$arches"
          flags=()
          for arch in "${architecture_list[@]}"; do
            flags+=("-gencode=arch=compute_$arch,code=sm_$arch")
          done
          printf '__global__ void cache_probe(int *value) { *value = 199; }\n' > "$scratch/probe.cu"
          source=$(cygpath -m "$scratch/probe.cu")
          object=$(cygpath -m "$scratch/probe.obj")
          "$SCCACHE" "$CUDACXX" -c "$source" -o "$object" "${flags[@]}"
          "$SCCACHE" --show-stats --stats-format json > target/ci-evidence/cold.json
          jq -e '.stats.cache_misses.counts.CUDA >= 1 and (.stats.cache_hits.counts.CUDA // 0) == 0' target/ci-evidence/cold.json
          mv "$scratch/probe.obj" "$scratch/cold.obj"

          tag=$("$SKIPPY_PYTHON" -c 'import tomllib; data = tomllib.load(open("Cargo.toml", "rb")); major, minor, patch = map(int, data["workspace"]["package"]["version"].split(".")); print(f"v{major}.{minor}.{patch + 1}")')
          just release-version "$tag"
          if git diff --quiet -- Cargo.lock; then
            echo 'Release staging did not update the lockfile' >&2
            exit 1
          fi
          git -c user.name=Rehearsal -c user.email=rehearsal@example.invalid commit -am "Rehearse release version $tag"
          candidate_namespace=$(bash scripts/ci-windows-cuda-cache.sh "$RUNTIME_ID" "$CUDA_VERSION")
          test "$candidate_namespace" = "$NAMESPACE"

          "$SCCACHE" "$CUDACXX" -c "$source" -o "$object" "${flags[@]}"
          "$SCCACHE" --show-stats --stats-format json > target/ci-evidence/warm.json
          jq -e '.stats.cache_hits.counts.CUDA >= 1' target/ci-evidence/warm.json
          cmp "$scratch/cold.obj" "$scratch/probe.obj"
          printf 'Verified a CUDA cache hit across release version staging for %s (%s architectures).\n' "$RUNTIME_ID" "$arches" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: cache-rehearsal-${{ matrix.runtime }}
          path: target/ci-evidence/*.json
          if-no-files-found: ignore
          retention-days: 7
