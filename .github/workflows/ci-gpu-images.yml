name: GPU CI images
on:
  pull_request:
    paths: ['.github/workflows/ci-gpu-images.yml', 'ci/Dockerfile.gpu', 'ci/Dockerfile.gpu.dockerignore', 'ci/targets.json', 'rust-toolchain.toml', 'Justfile']
  push:
    branches: [main]
    paths: ['.github/workflows/ci-gpu-images.yml', 'ci/Dockerfile.gpu', 'ci/Dockerfile.gpu.dockerignore', 'ci/targets.json', 'rust-toolchain.toml', 'Justfile']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: skippy-ci-gpu-images-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    name: Build and test ${{ matrix.backend }} image
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: cuda
            toolkit_version: '12.9.2,13.1.2'
            toolkit_base: 'nvidia/cuda:13.1.2-devel-ubuntu24.04@sha256:952e42d23230610a2714c8484f38e9c934ed68e6f9c9c7fac62dcd5f98858a6e'
          - backend: rocm
            toolkit_version: '7.2.4'
            toolkit_base: 'rocm/dev-ubuntu-24.04:7.2.4-complete@sha256:92f309c51b52cef8762867848f1529dee821624f23cd5df38455e819538f762f'
    env:
      SKIPPY_CI_IMAGE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.backend }}
      SOURCE_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache: 'false'
      - name: Build image
        env:
          BACKEND: ${{ matrix.backend }}
          TOOLKIT_BASE: ${{ matrix.toolkit_base }}
          TOOLKIT_VERSION: ${{ matrix.toolkit_version }}
        run: just ci-gpu-image-build "$BACKEND" "$TOOLKIT_BASE" "$TOOLKIT_VERSION"
      - name: Smoke test image
        run: time just ci-gpu-image-smoke '${{ matrix.backend }}'
      - name: Export tested image
        run: just ci-gpu-image-export '${{ matrix.backend }}'
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: skippy-ci-${{ matrix.backend }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/ci-image/skippy-ci-${{ matrix.backend }}.tar
            target/ci-image/skippy-ci-${{ matrix.backend }}.id
          if-no-files-found: error
          retention-days: 7
  publish:
    name: Publish tested ${{ matrix.backend }} image
    needs: build
    if: >-
      github.repository == 'general-inference/skippy' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        backend: [cuda, rocm]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: skippy-ci-${{ matrix.backend }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: image
      - name: Load and verify tested image
        env:
          BACKEND: ${{ matrix.backend }}
          TOOLKIT_VERSION: ${{ matrix.backend == 'cuda' && '12.9.2,13.1.2' || '7.2.4' }}
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker image load --input "image/skippy-ci-$BACKEND.tar"
          image="skippy-ci-$BACKEND:build"
          test "$(docker image inspect --format '{{.Id}}' "$image")" = "$(cat "image/skippy-ci-$BACKEND.id")"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image")" = "$SOURCE_REVISION"
          test "$(docker image inspect --format '{{index .Config.Labels "io.skippy.ci.backend"}}' "$image")" = "$BACKEND"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}}' "$image")" = "$TOOLKIT_VERSION"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable build and latest
        env:
          BACKEND: ${{ matrix.backend }}
        run: |
          set -euo pipefail
          image="ghcr.io/general-inference/skippy-ci-$BACKEND"
          build_tag="build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker image tag "skippy-ci-$BACKEND:build" "$image:$build_tag"
          docker image push "$image:$build_tag"
          docker image tag "skippy-ci-$BACKEND:build" "$image:latest"
          docker image push "$image:latest"
