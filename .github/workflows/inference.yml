name: Inference qualification
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      profile:
        type: choice
        options: [pr, nightly, release]
        default: pr
  workflow_call:
    secrets:
      JIANYANG_INFERENCE_SSH_KEY:
        required: true
permissions:
  contents: read
  pull-requests: read
  statuses: write
concurrency:
  group: inference-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      source: ${{ steps.admission.outputs.source || github.event.pull_request.head.sha || github.sha }}
      required: ${{ github.event_name != 'pull_request_target' || steps.paths.outputs.inference == 'true' }}
      profile: ${{ steps.admission.outputs.profile || 'pr' }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      # Credentialed controller source always comes from protected main.
      # Candidate source is never checked out or executed by this workflow.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: paths
        if: github.event_name == 'pull_request_target'
        with:
          predicate-quantifier: some-with-excludes
          filters: .github/path-filters.yml
      - uses: ./.github/actions/setup
        if: github.event_name != 'pull_request_target' || steps.paths.outputs.inference == 'true'
      - id: admission
        if: github.event_name != 'pull_request_target' || steps.paths.outputs.inference == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFICATION_PROFILE: ${{ inputs.profile || 'release' }}
        run: just automation-run inference admit
      - id: matrix
        if: github.event_name != 'pull_request_target' || steps.paths.outputs.inference == 'true'
        env:
          SOURCE_SHA: ${{ steps.admission.outputs.source }}
          PROFILE: ${{ steps.admission.outputs.profile }}
        run: just automation-run inference matrix "$PROFILE" "$SOURCE_SHA"
  qualification:
    name: qualification (${{ matrix.id }})
    needs: plan
    if: needs.plan.outputs.required == 'true'
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ needs.plan.outputs.profile == 'pr' && 45 || 360 }}
    env:
      EVIDENCE: target/ci-evidence/inference-${{ matrix.id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Dispatch and await native Spark qualification
        env:
          SOURCE_SHA: ${{ needs.plan.outputs.source }}
          PROFILE: ${{ needs.plan.outputs.profile }}
          CONFIGURATION: ${{ matrix.id }}
          JIANYANG_INFERENCE_SSH_KEY: ${{ secrets.JIANYANG_INFERENCE_SSH_KEY }}
        run: just automation-run inference dispatch "$PROFILE" "$SOURCE_SHA" "$EVIDENCE" "$CONFIGURATION"
      - name: Cancel outstanding JY jobs and formations
        if: cancelled() || failure()
        env:
          JIANYANG_INFERENCE_SSH_KEY: ${{ secrets.JIANYANG_INFERENCE_SSH_KEY }}
        run: |
          if test -f "$EVIDENCE/jobs.json"; then
            just inference-cancel "$EVIDENCE/jobs.json"
          fi
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: inference-${{ matrix.id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE }}
          if-no-files-found: error
          retention-days: 30
  summary:
    needs: [plan, qualification]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Publish the source-bound conditional qualification gate
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.plan.outputs.source || github.event.pull_request.head.sha || github.sha }}
          PLAN: ${{ needs.plan.result }}
          REQUIRED: ${{ needs.plan.outputs.required }}
          RESULT: ${{ needs.qualification.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const { SOURCE_SHA: sha, PLAN: plan, REQUIRED: required, RESULT: result, RUN_URL: url } = process.env;
            if (!/^[a-f0-9]{40}$/i.test(sha)) throw new Error('Invalid qualification source SHA');
            const passed = plan === 'success' && (
              (required === 'true' && result === 'success') ||
              (required === 'false' && result === 'skipped')
            );
            const description = passed
              ? (required === 'true' ? 'Native Spark lab qualification' : 'No inference inputs changed; model tests not required')
              : 'Inference admission or qualification incomplete or failed';
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha, context: 'Inference qualification',
              state: passed ? 'success' : 'failure', description, target_url: url
            });
            if (!passed) core.setFailed(description);

  report:
    needs: [plan, qualification, summary]
    if: always() && github.event_name == 'pull_request_target' && needs.plan.outputs.required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          persist-credentials: false
      - name: Collect controller receipts when available
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        continue-on-error: true
        with:
          pattern: inference-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/inference-comment
          merge-multiple: true
      - name: Update the PR results comment
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.plan.outputs.source || github.event.pull_request.head.sha }}
          PLAN: ${{ needs.plan.result }}
          REQUIRED: ${{ needs.plan.outputs.required }}
          RESULT: ${{ needs.qualification.result }}
        run: bash scripts/inference-report.sh target/inference-comment
