name: Inference qualification
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'crates/**'
      - 'llama_cpp/**'
      - 'tools/**'
      - 'scripts/**'
      - 'ci/**'
      - '.gi/**'
      - '.github/**'
      - '.cargo/**'
      - 'Cargo.*'
      - 'Justfile'
      - 'rust-toolchain*'
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      profile:
        type: choice
        options: [pr, nightly, release]
        default: pr
  workflow_call:
    secrets:
      JIANYANG_INFERENCE_SSH_KEY:
        required: true
permissions:
  contents: read
  pull-requests: read
  statuses: write
concurrency:
  group: inference-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}
jobs:
  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 1440
    steps:
      # Only protected controller code is executed with credentials. Never check
      # out PR source here; admission verifies the author before native dispatch.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          persist-credentials: false
      - uses: ./.github/actions/setup
      - id: admission
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFICATION_PROFILE: ${{ inputs.profile || 'release' }}
        run: just automation-run inference admit
      - name: Dispatch and await native Spark qualification
        env:
          SOURCE_SHA: ${{ steps.admission.outputs.source }}
          PROFILE: ${{ steps.admission.outputs.profile }}
          JIANYANG_INFERENCE_SSH_KEY: ${{ secrets.JIANYANG_INFERENCE_SSH_KEY }}
        run: just inference-dispatch "$PROFILE" "$SOURCE_SHA"
      - name: Publish qualification status on the tested commit
        if: always() && steps.admission.outputs.source != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.admission.outputs.source }}
          RESULT: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          state=failure
          if test "$RESULT" = success; then state=success; fi
          gh api --method POST "repos/general-inference/skippy/statuses/$SOURCE_SHA" \
            -f "state=$state" -f context='Inference qualification' \
            -f "target_url=$RUN_URL" -f 'description=Native JY Spark qualification'
      - name: Cancel outstanding JY jobs and formations
        if: cancelled() || failure()
        env:
          JIANYANG_INFERENCE_SSH_KEY: ${{ secrets.JIANYANG_INFERENCE_SSH_KEY }}
        run: |
          if test -f target/ci-evidence/inference/jobs.json; then
            just inference-cancel
          fi
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: inference-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/ci-evidence/inference
          if-no-files-found: error
          retention-days: 30
