name: CI
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      profile:
        description: Short checks or complete native/package qualification
        type: choice
        options: [pr, full]
        default: full
      cuda_architecture_mode:
        description: CUDA architectures for the assigned GPU or the release architecture set
        type: choice
        options: [native, release]
        default: native
  workflow_call:
    inputs:
      profile:
        type: string
        default: full
      cuda_architecture_mode:
        type: string
        default: release
      artifact_scope:
        type: string
        default: ci
      candidate_artifact:
        type: string
        default: ''
      candidate_sha:
        type: string
        default: ''
      jy_runners:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: skippy-ci-${{ github.workflow }}-${{ inputs.artifact_scope || 'ci' }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_PROFILE_RELEASE_DEBUG: '0'
  CARGO_PROFILE_BENCH_DEBUG: '0'
  SCCACHE_GHA_ENABLED: 'true'
  SKIPPY_REQUIRE_SCCACHE: '1'
  SKIPPY_CUDA_ARCHITECTURE_MODE: ${{ inputs.cuda_architecture_mode || 'native' }}
  SKIPPY_ARTIFACT_SCOPE: ${{ inputs.artifact_scope || 'ci' }}
jobs:
  plan:
    name: Plan & validate CI
    runs-on: ${{ inputs.jy_runners && fromJSON('{"group":"jy-rnr_vfnz8k5p4yrh334","labels":["self-hosted","jy-linux-docker","Linux","X64"]}') || 'ubuntu-24.04' }}
    timeout-minutes: 20
    env:
      SKIPPY_CI_PROFILE: ${{ inputs.profile || (github.event_name == 'schedule' && 'full' || 'pr') }}
    outputs:
      profile: ${{ steps.plan.outputs.profile }}
      hosts: ${{ steps.plan.outputs.hosts }}
      runtimes: ${{ steps.plan.outputs.runtimes }}
    steps:
      - name: Validate CUDA architecture mode
        shell: bash
        run: |
          case "$SKIPPY_CUDA_ARCHITECTURE_MODE" in
            native|release) ;;
            *) echo "::error::CUDA architecture mode must be native or release."; exit 1 ;;
          esac
      - name: Admit manual source
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Ad hoc CI must run from the protected main branch."
            exit 1
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - id: plan
        name: Validate and project the release matrix
        env:
          SKIPPY_CI_JY_RUNNERS: ${{ inputs.jy_runners || false }}
        run: just ci-plan
  inference_contracts:
    name: Validate inference tooling
    needs: plan
    runs-on: ${{ inputs.jy_runners && fromJSON('{"group":"jy-rnr_vfnz8k5p4yrh334","labels":["self-hosted","jy-linux-docker","Linux","X64"]}') || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/source
        with:
          artifact: ${{ inputs.candidate_artifact }}
          sha: ${{ inputs.candidate_sha }}
      - run: just inference-tool-check
  quality:
    name: Lint & test core (Linux CPU)
    needs: plan
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '4'
      CTEST_PARALLEL_LEVEL: '2'
      SKIPPY_REWRITER_LLVM_PREFIX: /usr/lib/llvm-22
      LIBCLANG_PATH: /usr/lib/llvm-22/lib
      SKIPPY_REQUIRE_SCCACHE: '1'
      SCCACHE_GHA_ENABLED: 'true'
    runs-on:
      group: jy-rnr_vfnz8k5p4yrh334
      labels: [self-hosted, skippy-ephemeral, Linux, native-contracts]
    timeout-minutes: ${{ needs.plan.outputs.profile == 'pr' && 30 || 180 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        if: runner.environment == 'github-hosted'
      - uses: ./.github/actions/cache
        if: runner.environment == 'self-hosted'
      - uses: ./.github/actions/sccache
        with:
          scope: quality-${{ runner.os }}-${{ runner.arch }}
      - uses: ./.github/actions/source
        with:
          artifact: ${{ inputs.candidate_artifact }}
          sha: ${{ inputs.candidate_sha }}
      - run: just ci-contracts
      - run: just llama-prepare
      - run: just skippy-ffi-bindgen-check
      - run: just lint
      - run: just test
      - run: just llama-check
        if: needs.plan.outputs.profile == 'full'
      - name: Report compiler cache
        if: always()
        run: '"$SCCACHE" --show-stats'
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: ${{ env.SKIPPY_ARTIFACT_SCOPE }}-quality-evidence
          path: |
            target/ci-evidence/**
            target/skippy-llama-api-build/Testing/**
            target/skippy-stage-rewriter-check/report*
            target/skippy-stage-rewriter-check/patch-drift.diff
            target/skippy-stage-rewriter-check/changed-family-selection.json
            target/skippy-stage-rewriter-check/generated-family-shards/**
            target/skippy-stage-rewriter-check/tool-build/Testing/**
            .deps/llama-build/**/Testing/**
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
  host:
    name: Build & test CLI (${{ matrix.display_name }})
    needs: plan
    if: needs.plan.outputs.profile == 'full'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.hosts) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        if: runner.environment == 'github-hosted'
      - uses: ./.github/actions/sccache
        with:
          scope: host-${{ matrix.id }}
      - uses: ./.github/actions/source
        with:
          artifact: ${{ inputs.candidate_artifact }}
          sha: ${{ inputs.candidate_sha }}
      - name: Build backend-neutral host
        shell: bash
        env:
          HOST_ID: ${{ matrix.id }}
        run: just ci-host "$HOST_ID"
      - name: Report compiler cache
        if: always()
        run: '"$SCCACHE" --show-stats'
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ env.SKIPPY_ARTIFACT_SCOPE }}-host-${{ matrix.id }}
          path: dist/hosts/${{ matrix.id }}
          if-no-files-found: error
          retention-days: 7
  runtime_darwin_aarch64_cpu:
    name: Build & test Runtime (macOS ARM64, CPU)
    needs: plan
    if: needs.plan.outputs.profile == 'full'
    runs-on: ${{ inputs.jy_runners && fromJSON('{"group":"jy-rnr_h7x5s2yx9gtkz3c","labels":["self-hosted","skippy-ephemeral","macOS","ARM64"]}') || 'macos-15' }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-runtime
        with:
          runtime_id: darwin-aarch64-cpu
          candidate_artifact: ${{ inputs.candidate_artifact }}
          candidate_sha: ${{ inputs.candidate_sha }}
  runtime_darwin_aarch64_metal:
    name: Build & test Runtime (macOS ARM64, Metal)
    needs: plan
    if: needs.plan.outputs.profile == 'full'
    runs-on:
      group: jy-rnr_h7x5s2yx9gtkz3c
      labels: ["self-hosted", "skippy-ephemeral", "macOS", "ARM64", "metal"]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-runtime
        with:
          runtime_id: darwin-aarch64-metal
          candidate_artifact: ${{ inputs.candidate_artifact }}
          candidate_sha: ${{ inputs.candidate_sha }}
  runtime_linux_x86_64_cpu:
    name: Build & test Runtime (Linux x86_64, CPU)
    needs: plan
    if: needs.plan.outputs.profile == 'full'
    runs-on: ${{ inputs.jy_runners && fromJSON('{"group":"jy-rnr_vfnz8k5p4yrh334","labels":["self-hosted","jy-linux-docker","Linux","X64"]}') || 'ubuntu-24.04' }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-runtime
        with:
          runtime_id: linux-x86_64-cpu
          candidate_artifact: ${{ inputs.candidate_artifact }}
          candidate_sha: ${{ inputs.candidate_sha }}
  runtime_linux_x86_64_cuda12:
    name: Build & test Runtime (Linux x86_64, CUDA 12)
    needs: plan
    if: needs.plan.outputs.profile == 'full'
    runs-on:
      group: jy-rnr_btc4xhvks1eer0j
      labels: ["self-hosted", "skippy-ephemeral", "Linux", "X64", "runtime-image", "cuda12"]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-runtime
        with:
          runtime_id: linux-x86_64-cuda12
