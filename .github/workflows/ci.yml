      - uses: ./.github/actions/ci-runtime
        with:
          runtime_id: linux-aarch64-cpu
          candidate_artifact: ${{ inputs.candidate_artifact }}
          candidate_sha: ${{ inputs.candidate_sha }}
  runtime_linux_aarch64_cuda12:
    name: Build · Linux ARM64 · CUDA 12
    needs: plan
    if: needs.plan.outputs.profile == 'full'
    runs-on:
      group: jy-rnr_pg90ves41xbxvwy
      labels: ["self-hosted", "skippy-ephemeral", "Linux", "ARM64", "runtime-image", "cuda12"]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-runtime
        with:
          runtime_id: linux-aarch64-cuda12
          candidate_artifact: ${{ inputs.candidate_artifact }}
          candidate_sha: ${{ inputs.candidate_sha }}
  runtime_linux_aarch64_cuda13:
    name: Build · Linux ARM64 · CUDA 13
    needs: plan
    if: needs.plan.outputs.profile == 'full'
    runs-on:
      group: jy-rnr_8gvzbe9b9d79y0k
      labels: ["self-hosted", "skippy-ephemeral", "Linux", "ARM64", "runtime-image", "cuda13"]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-runtime
        with:
          runtime_id: linux-aarch64-cuda13
          candidate_artifact: ${{ inputs.candidate_artifact }}
          candidate_sha: ${{ inputs.candidate_sha }}
  runtime:
    name: Runtime build summary
    needs: [plan, runtime_darwin_aarch64_cpu, runtime_darwin_aarch64_metal, runtime_linux_x86_64_cpu, runtime_linux_x86_64_cuda12, runtime_linux_x86_64_cuda13, runtime_linux_aarch64_cpu, runtime_linux_aarch64_cuda12, runtime_linux_aarch64_cuda13]
    if: always() && needs.plan.outputs.profile == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: just automation-run ci runtime-summary
        env:
          SKIPPY_CI_NEEDS: ${{ toJSON(needs) }}
  product:
    name: Package · ${{ matrix.display_name }}
    needs: [plan, host, runtime]
    if: needs.plan.outputs.profile == 'full'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.runtimes) }}
    runs-on: ${{ matrix.host_runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        if: runner.environment == 'github-hosted'
      - uses: ./.github/actions/source
        with:
          artifact: ${{ inputs.candidate_artifact }}
          sha: ${{ inputs.candidate_sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.SKIPPY_ARTIFACT_SCOPE }}-host-${{ matrix.host }}
          path: inputs/host
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.SKIPPY_ARTIFACT_SCOPE }}-runtime-${{ matrix.id }}
          path: inputs/runtime
      - name: Compose exact producers and verify startup on a hosted machine
        shell: bash
        env:
          RUNTIME_ID: ${{ matrix.id }}
        run: just ci-package "$RUNTIME_ID" inputs/host inputs/runtime
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ env.SKIPPY_ARTIFACT_SCOPE }}-package-${{ matrix.id }}
          path: dist/products/${{ matrix.id }}
          if-no-files-found: error
          retention-days: 7
  smoke_darwin_aarch64_cpu:
    name: Test · macOS · CPU
    needs: [plan, product]
    if: needs.plan.outputs.profile == 'full'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-smoke
        with:
          runtime_id: darwin-aarch64-cpu
          candidate_artifact: ${{ inputs.candidate_artifact }}
          candidate_sha: ${{ inputs.candidate_sha }}
  smoke_darwin_aarch64_metal:
    name: Test · macOS · Metal
    needs: [plan, product]
    if: needs.plan.outputs.profile == 'full'
    runs-on:
      group: jy-rnr_h7x5s2yx9gtkz3c
      labels: ["self-hosted", "skippy-ephemeral", "macOS", "ARM64", "metal"]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-smoke
        with:
          runtime_id: darwin-aarch64-metal
          candidate_artifact: ${{ inputs.candidate_artifact }}
          candidate_sha: ${{ inputs.candidate_sha }}
  smoke_linux_x86_64_cpu:
