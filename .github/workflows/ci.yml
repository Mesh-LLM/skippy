name: CI
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      profile:
        description: Short checks or complete native/package qualification
        type: choice
        options: [pr, full]
        default: full
      cuda_architecture_mode:
        description: CUDA architectures for the assigned GPU or the release architecture set
        type: choice
        options: [native, release]
        default: native
  workflow_call:
    inputs:
      profile:
        type: string
        default: full
      cuda_architecture_mode:
        type: string
        default: release
      artifact_scope:
        type: string
        default: ci
      candidate_artifact:
        type: string
        default: ''
      candidate_sha:
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: skippy-ci-${{ github.workflow }}-${{ inputs.artifact_scope || 'ci' }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_PROFILE_RELEASE_DEBUG: '0'
  CARGO_PROFILE_BENCH_DEBUG: '0'
  SCCACHE_GHA_ENABLED: 'true'
  SKIPPY_REQUIRE_SCCACHE: '1'
  SKIPPY_CUDA_ARCHITECTURE_MODE: ${{ inputs.cuda_architecture_mode || 'native' }}
  SKIPPY_ARTIFACT_SCOPE: ${{ inputs.artifact_scope || 'ci' }}
jobs:
  changes:
    name: Select checks by path
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ inputs.profile != '' || (github.event_name != 'pull_request' && github.event_name != 'push') || steps.paths.outputs.code == 'true' }}
      docs: ${{ inputs.profile == '' && github.event_name == 'pull_request' && steps.paths.outputs.docs == 'true' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        if: inputs.profile == '' && (github.event_name == 'pull_request' || github.event_name == 'push')
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: paths
        if: inputs.profile == '' && (github.event_name == 'pull_request' || github.event_name == 'push')
        with:
          predicate-quantifier: some-with-excludes
          filters: .github/path-filters.yml
  documentation:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    uses: ./.github/workflows/docs.yml
  plan:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SKIPPY_CI_PROFILE: ${{ inputs.profile || (github.event_name == 'schedule' && 'full' || 'pr') }}
    outputs:
      profile: ${{ steps.plan.outputs.profile }}
      hosts: ${{ steps.plan.outputs.hosts }}
      runtimes: ${{ steps.plan.outputs.runtimes }}
    steps:
      - name: Validate CUDA architecture mode
        shell: bash
        run: |
          case "$SKIPPY_CUDA_ARCHITECTURE_MODE" in
            native|release) ;;
            *) echo "::error::CUDA architecture mode must be native or release."; exit 1 ;;
          esac
      - name: Admit manual source
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Ad hoc CI must run from the protected main branch."
            exit 1
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - id: plan
        run: just ci-plan
  inference_contracts:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/source
        with:
          artifact: ${{ inputs.candidate_artifact }}
          sha: ${{ inputs.candidate_sha }}
      - run: just automation-contracts
      - name: Test inference results reporting
        run: bash scripts/tests/inference-report.sh
      - name: Test workflow result gates
        run: node --test .github/scripts/*.test.cjs
  quality:
    needs: plan
    env:
      CARGO_BUILD_JOBS: '2'
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      CTEST_PARALLEL_LEVEL: '2'
      CC: /usr/lib/llvm-22/bin/clang
      CXX: /usr/lib/llvm-22/bin/clang++
      SKIPPY_REWRITER_LLVM_PREFIX: /usr/lib/llvm-22
      LIBCLANG_PATH: /usr/lib/llvm-22/lib
      SKIPPY_REQUIRE_SCCACHE: '1'
      SCCACHE_GHA_ENABLED: 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/general-inference/skippy-ci-cpu:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    timeout-minutes: ${{ needs.plan.outputs.profile == 'pr' && 30 || 180 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Verify image toolchain and cache identity
        shell: bash
        run: |
          set -euo pipefail
          rustc --version
          just --version
          sccache --version
          "$CC" --version
          "$CXX" --version
          "$SKIPPY_REWRITER_LLVM_PREFIX/bin/clang-format" --version
          "$SKIPPY_REWRITER_LLVM_PREFIX/bin/clang-tidy" --version
          "$SKIPPY_REWRITER_LLVM_PREFIX/bin/clang" --version
          test -r "$SKIPPY_REWRITER_LLVM_PREFIX/lib/cmake/llvm/LLVMConfig.cmake"
          test -r "$SKIPPY_REWRITER_LLVM_PREFIX/lib/cmake/clang/ClangConfig.cmake"
          image_id="$(cat /etc/skippy-ci-image-id)"
          test -n "$image_id"
          echo "SKIPPY_TOOLCHAIN_CACHE_KEY=$image_id" >> "$GITHUB_ENV"
      - uses: ./.github/actions/source
        # Protected admission runs before GitHub compiler-cache credentials are exported.
        with:
          artifact: ${{ inputs.candidate_artifact }}
          sha: ${{ inputs.candidate_sha }}
      - uses: ./.github/actions/cache
        with:
          scope: quality-${{ env.SKIPPY_TOOLCHAIN_CACHE_KEY }}
          download-scope: quality-container
          build-paths: |
            target/debug
            skippy-api-rs/target/debug
      - uses: ./.github/actions/sccache
        with:
          scope: quality-${{ runner.os }}-${{ runner.arch }}-${{ env.SKIPPY_TOOLCHAIN_CACHE_KEY }}
      - uses: ./.github/actions/native-source
      - run: just llama-prepare
      - run: just skippy-ffi-bindgen-check
      - run: just lint
      - run: just test
      - run: just llama-check
        if: needs.plan.outputs.profile == 'full'
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: ${{ env.SKIPPY_ARTIFACT_SCOPE }}-quality-evidence
          path: |
            target/ci-evidence/**
            target/skippy-api-build/Testing/**
            target/skippy-llama-api-build/Testing/**
            target/skippy-stage-rewriter-check/report*
            target/skippy-stage-rewriter-check/patch-drift.diff
            target/skippy-stage-rewriter-check/changed-family-selection.json
            target/skippy-stage-rewriter-check/generated-family-shards/**
            target/skippy-stage-rewriter-check/tool-build/Testing/**
            .deps/llama-build/**/Testing/**
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
  host:
    name: Build Skippy · ${{ matrix.display_name }}
    needs: plan
    if: needs.plan.outputs.profile == 'full'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.hosts) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        if: runner.environment == 'github-hosted'
        with:
          cache: 'false'
      - uses: ./.github/actions/source
        with:
          artifact: ${{ inputs.candidate_artifact }}
          sha: ${{ inputs.candidate_sha }}
      - uses: ./.github/actions/cache
        with:
          scope: host-${{ matrix.id }}-backend-neutral
          download-scope: host
          build-paths: |
            target/debug
            target/release
      - uses: ./.github/actions/sccache
        with:
          scope: host-${{ matrix.id }}
      - name: Build backend-neutral host
        shell: bash
        env:
          HOST_ID: ${{ matrix.id }}
        run: just ci-host "$HOST_ID"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ env.SKIPPY_ARTIFACT_SCOPE }}-host-${{ matrix.id }}
          path: dist/hosts/${{ matrix.id }}
          if-no-files-found: error
          retention-days: 7
  runtime_darwin_aarch64_cpu:
    name: Build · macOS · CPU
    needs: plan
    if: needs.plan.outputs.profile == 'full'
    runs-on: macos-15
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-runtime
        with:
          runtime_id: darwin-aarch64-cpu
          candidate_artifact: ${{ inputs.candidate_artifact }}
          candidate_sha: ${{ inputs.candidate_sha }}
  runtime_darwin_aarch64_metal:
    name: Build · macOS · Metal
    needs: plan
    if: needs.plan.outputs.profile == 'full'
    runs-on:
      group: jy-rnr_h7x5s2yx9gtkz3c
      labels: ["self-hosted", "skippy-ephemeral", "macOS", "ARM64", "metal"]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-runtime
        with:
          runtime_id: darwin-aarch64-metal
          candidate_artifact: ${{ inputs.candidate_artifact }}
          candidate_sha: ${{ inputs.candidate_sha }}
  runtime_linux_x86_64_cpu:
    name: Build · Linux x64 · CPU
    needs: plan
    if: needs.plan.outputs.profile == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-runtime
        with:
          runtime_id: linux-x86_64-cpu
          candidate_artifact: ${{ inputs.candidate_artifact }}
          candidate_sha: ${{ inputs.candidate_sha }}
  runtime_linux_x86_64_cuda12:
    name: Build · Linux x64 · CUDA 12
    needs: plan
    if: needs.plan.outputs.profile == 'full'
    runs-on:
      group: jy-rnr_btc4xhvks1eer0j
      labels: ["self-hosted", "skippy-ephemeral", "Linux", "X64", "runtime-image", "cuda12"]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-runtime
        with:
          runtime_id: linux-x86_64-cuda12
          candidate_artifact: ${{ inputs.candidate_artifact }}
          candidate_sha: ${{ inputs.candidate_sha }}
  runtime_linux_x86_64_cuda13:
    name: Build · Linux x64 · CUDA 13
    needs: plan
    if: needs.plan.outputs.profile == 'full'
    runs-on:
      group: jy-rnr_p0zx3thw895vrka
      labels: ["self-hosted", "skippy-ephemeral", "Linux", "X64", "runtime-image", "cuda13"]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-runtime
        with:
          runtime_id: linux-x86_64-cuda13
          candidate_artifact: ${{ inputs.candidate_artifact }}
          candidate_sha: ${{ inputs.candidate_sha }}
  runtime_linux_aarch64_cpu:
    name: Build · Linux ARM64 · CPU
    needs: plan
    if: needs.plan.outputs.profile == 'full'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-runtime
        with:
          runtime_id: linux-aarch64-cpu
          candidate_artifact: ${{ inputs.candidate_artifact }}
          candidate_sha: ${{ inputs.candidate_sha }}
  runtime_linux_aarch64_cuda12:
    name: Build · Linux ARM64 · CUDA 12
    needs: plan
    if: needs.plan.outputs.profile == 'full'
    runs-on:
      group: jy-rnr_pg90ves41xbxvwy
      labels: ["self-hosted", "skippy-ephemeral", "Linux", "ARM64", "runtime-image", "cuda12"]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-runtime
        with:
          runtime_id: linux-aarch64-cuda12
          candidate_artifact: ${{ inputs.candidate_artifact }}
          candidate_sha: ${{ inputs.candidate_sha }}
  runtime_linux_aarch64_cuda13:
    name: Build · Linux ARM64 · CUDA 13
    needs: plan
    if: needs.plan.outputs.profile == 'full'
    runs-on:
      group: jy-rnr_8gvzbe9b9d79y0k
      labels: ["self-hosted", "skippy-ephemeral", "Linux", "ARM64", "runtime-image", "cuda13"]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-runtime
        with:
          runtime_id: linux-aarch64-cuda13
          candidate_artifact: ${{ inputs.candidate_artifact }}
          candidate_sha: ${{ inputs.candidate_sha }}
  runtime:
    name: Runtime build summary
    needs: [plan, runtime_darwin_aarch64_cpu, runtime_darwin_aarch64_metal, runtime_linux_x86_64_cpu, runtime_linux_x86_64_cuda12, runtime_linux_x86_64_cuda13, runtime_linux_aarch64_cpu, runtime_linux_aarch64_cuda12, runtime_linux_aarch64_cuda13]
    if: always() && needs.plan.outputs.profile == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache: 'false'
      - run: just ci-runtime-summary
        env:
          SKIPPY_CI_NEEDS: ${{ toJSON(needs) }}
  product:
    name: Package · ${{ matrix.display_name }}
    needs: [plan, host, runtime]
    if: needs.plan.outputs.profile == 'full'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.runtimes) }}
    runs-on: ${{ matrix.host_runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        if: runner.environment == 'github-hosted'
      - uses: ./.github/actions/source
        with:
          artifact: ${{ inputs.candidate_artifact }}
          sha: ${{ inputs.candidate_sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.SKIPPY_ARTIFACT_SCOPE }}-host-${{ matrix.host }}
          path: inputs/host
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.SKIPPY_ARTIFACT_SCOPE }}-runtime-${{ matrix.id }}
          path: inputs/runtime
      - name: Compose exact producers and verify startup on a hosted machine
        shell: bash
        env:
          RUNTIME_ID: ${{ matrix.id }}
        run: just ci-package "$RUNTIME_ID" inputs/host inputs/runtime
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ env.SKIPPY_ARTIFACT_SCOPE }}-package-${{ matrix.id }}
          path: dist/products/${{ matrix.id }}
          if-no-files-found: error
          retention-days: 7
  smoke_darwin_aarch64_cpu:
    name: Test · macOS · CPU
    needs: [plan, product]
    if: needs.plan.outputs.profile == 'full'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-smoke
        with:
          runtime_id: darwin-aarch64-cpu
          candidate_artifact: ${{ inputs.candidate_artifact }}
          candidate_sha: ${{ inputs.candidate_sha }}
  smoke_darwin_aarch64_metal:
    name: Test · macOS · Metal
    needs: [plan, product]
    if: needs.plan.outputs.profile == 'full'
    runs-on:
      group: jy-rnr_h7x5s2yx9gtkz3c
      labels: ["self-hosted", "skippy-ephemeral", "macOS", "ARM64", "metal"]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-smoke
        with:
          runtime_id: darwin-aarch64-metal
          candidate_artifact: ${{ inputs.candidate_artifact }}
          candidate_sha: ${{ inputs.candidate_sha }}
  smoke_linux_x86_64_cpu:
    name: Test · Linux x64 · CPU
    needs: [plan, product]
    if: needs.plan.outputs.profile == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-smoke
        with:
          runtime_id: linux-x86_64-cpu
          candidate_artifact: ${{ inputs.candidate_artifact }}
          candidate_sha: ${{ inputs.candidate_sha }}
  smoke_linux_x86_64_cuda12:
    name: Test · Linux x64 · CUDA 12
    needs: [plan, product]
    if: needs.plan.outputs.profile == 'full'
    runs-on:
      group: jy-rnr_btc4xhvks1eer0j
      labels: ["self-hosted", "skippy-ephemeral", "Linux", "X64", "runtime-image", "cuda12"]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-smoke
        with:
          runtime_id: linux-x86_64-cuda12
          candidate_artifact: ${{ inputs.candidate_artifact }}
          candidate_sha: ${{ inputs.candidate_sha }}
  smoke_linux_x86_64_cuda13:
    name: Test · Linux x64 · CUDA 13
    needs: [plan, product]
    if: needs.plan.outputs.profile == 'full'
    runs-on:
      group: jy-rnr_p0zx3thw895vrka
      labels: ["self-hosted", "skippy-ephemeral", "Linux", "X64", "runtime-image", "cuda13"]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-smoke
        with:
          runtime_id: linux-x86_64-cuda13
          candidate_artifact: ${{ inputs.candidate_artifact }}
          candidate_sha: ${{ inputs.candidate_sha }}
  smoke_linux_aarch64_cpu:
    name: Test · Linux ARM64 · CPU
    needs: [plan, product]
    if: needs.plan.outputs.profile == 'full'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-smoke
        with:
          runtime_id: linux-aarch64-cpu
          candidate_artifact: ${{ inputs.candidate_artifact }}
          candidate_sha: ${{ inputs.candidate_sha }}
  smoke_linux_aarch64_cuda12:
    name: Test · Linux ARM64 · CUDA 12
    needs: [plan, product]
    if: needs.plan.outputs.profile == 'full'
    runs-on:
      group: jy-rnr_pg90ves41xbxvwy
      labels: ["self-hosted", "skippy-ephemeral", "Linux", "ARM64", "runtime-image", "cuda12"]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-smoke
        with:
          runtime_id: linux-aarch64-cuda12
          candidate_artifact: ${{ inputs.candidate_artifact }}
          candidate_sha: ${{ inputs.candidate_sha }}
  smoke_linux_aarch64_cuda13:
    name: Test · Linux ARM64 · CUDA 13
    needs: [plan, product]
    if: needs.plan.outputs.profile == 'full'
    runs-on:
      group: jy-rnr_8gvzbe9b9d79y0k
      labels: ["self-hosted", "skippy-ephemeral", "Linux", "ARM64", "runtime-image", "cuda13"]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-smoke
        with:
          runtime_id: linux-aarch64-cuda13
          candidate_artifact: ${{ inputs.candidate_artifact }}
          candidate_sha: ${{ inputs.candidate_sha }}
  smoke:
    name: Runtime test summary
    needs: [plan, smoke_darwin_aarch64_cpu, smoke_darwin_aarch64_metal, smoke_linux_x86_64_cpu, smoke_linux_x86_64_cuda12, smoke_linux_x86_64_cuda13, smoke_linux_aarch64_cpu, smoke_linux_aarch64_cuda12, smoke_linux_aarch64_cuda13]
    if: always() && needs.plan.outputs.profile == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate all runtime smoke-test results
        env:
          SKIPPY_CI_NEEDS: ${{ toJSON(needs) }}
          RUNTIME_MATRIX: ${{ needs.plan.outputs.runtimes }}
        run: |
          jq -en --argjson needs "$SKIPPY_CI_NEEDS" --argjson matrix "$RUNTIME_MATRIX" '
            ($matrix.include | map("smoke_" + (.id | gsub("-"; "_")))) as $jobs |
            ($jobs + ["plan"] | sort) as $expected |
            ($jobs | length) > 0 and
            ($needs | keys) == $expected and
            all($expected[]; $needs[.].result == "success")
          ' || {
            echo '::error::Plan and every active runtime smoke test must succeed, with no missing or unexpected jobs.'
            exit 1
          }
  summary:
    name: ${{ needs.plan.outputs.profile == 'full' && 'Full qualification' || 'Code checks' }}
    needs: [plan, inference_contracts, quality, host, runtime, product, smoke]
    if: always() && needs.plan.result != 'skipped'
    outputs:
      profile: ${{ needs.plan.outputs.profile }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: just ci-summary
        env:
          SKIPPY_CI_PROFILE: ${{ needs.plan.outputs.profile }}
          SKIPPY_CI_NEEDS: ${{ toJSON(needs) }}
  gate:
    name: ${{ needs.summary.outputs.profile == 'full' && 'Full CI gate' || 'CI' }}
    needs: [changes, documentation, summary]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          CHECK_RESULTS: ${{ toJSON(needs) }}
        with:
          script: |
            const needs = JSON.parse(process.env.CHECK_RESULTS);
            if (needs.changes.result !== 'success') {
              core.setFailed('Path selection failed or was cancelled');
              return;
            }
            for (const [filter, job] of [['code', 'summary'], ['docs', 'documentation']]) {
              const required = needs.changes.outputs[filter];
              const expected = required === 'true' ? 'success' : 'skipped';
              if (!['true', 'false'].includes(required) || needs[job].result !== expected) {
                core.setFailed(`${job} must be ${expected}; got ${needs[job].result}`);
              }
            }
