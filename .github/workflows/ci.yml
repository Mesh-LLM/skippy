name: CI
on:
  pull_request:
    # Include the inference-only inputs as well as the code filter.
    paths:
      - 'crates/**'
      - 'skippy-api-rs/**'
      - 'skippy_api/**'
      - 'llama_cpp/**'
      - 'tools/**'
      - 'scripts/**'
      - '.cargo/**'
      - '.github/actions/**'
      - '.github/scripts/**'
      - '.github/path-filters.yml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/inference.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'Justfile'
      - 'ci/targets.json'
      - 'ci/llama-canary/**'
      - '.gi/templates.yaml'
      - 'ci/inference-ladder.json'
      - 'ci/inference-artifacts.json'
      - 'ci/inference-quality.json'
      - '!**/*.md'
      - '!**/*.mdx'
      - '!**/*.rst'
      - '!**/*.adoc'
      - '!**/docs/**'
      - '!docs-site/**'
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'skippy-api-rs/**'
      - 'skippy_api/**'
      - 'llama_cpp/**'
      - 'tools/**'
      - 'scripts/**'
      - '.cargo/**'
      - '.github/actions/**'
      - '.github/scripts/**'
      - '.github/path-filters.yml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/inference.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'Justfile'
      - 'ci/targets.json'
      - 'ci/llama-canary/**'
      - '!**/*.md'
      - '!**/*.mdx'
      - '!**/*.rst'
      - '!**/*.adoc'
      - '!**/docs/**'
      - '!docs-site/**'
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      profile:
        description: Short checks or complete native/package qualification
        type: choice
        options: [pr, full]
        default: full
      cuda_architecture_mode:
        description: CUDA architectures for the assigned GPU or the release architecture set
        type: choice
        options: [native, release]
        default: native
  workflow_call:
    inputs:
      profile:
        type: string
        default: full
      cuda_architecture_mode:
        type: string
        default: release
      artifact_scope:
        type: string
        default: ci
      source_ref:
        type: string
        default: ''
      candidate_artifact:
        type: string
        default: ''
      candidate_sha:
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  # Main pushes share one slot. GitHub's default queue replaces a pending run
  # when another push arrives, and the running build finishes.
  group: >-
    skippy-ci-${{ github.workflow }}-${{ inputs.artifact_scope || 'ci' }}-${{
      github.event.pull_request.number ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main-push') ||
      github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_PROFILE_RELEASE_DEBUG: '0'
  CARGO_PROFILE_BENCH_DEBUG: '0'
  SCCACHE_GHA_ENABLED: 'true'
  SKIPPY_REQUIRE_SCCACHE: '1'
  SKIPPY_CUDA_ARCHITECTURE_MODE: ${{ inputs.cuda_architecture_mode || 'native' }}
  SKIPPY_CI_SOURCE_REF: ${{ inputs.source_ref || github.sha }}
  SKIPPY_ARTIFACT_SCOPE: ${{ inputs.artifact_scope || 'ci' }}
  # Release builds report anonymous usage; every other build is keyless and
  # reports nothing. The key is a public ingestion token, not a secret.
  SKIPPY_POSTHOG_KEY: ${{ inputs.artifact_scope == 'release' && vars.SKIPPY_POSTHOG_KEY || '' }}
jobs:
  changes:
    name: Select checks by path
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      code: ${{ steps.release.outputs.verified != 'true' && (inputs.profile != '' || github.event_name != 'pull_request' || steps.paths.outputs.code == 'true') }}
      inference: ${{ inputs.profile == '' && github.event_name == 'pull_request' && steps.paths.outputs.inference == 'true' }}
    steps:
      - name: Reuse qualification from the exact promoted release
        id: release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            try {
              const repo = context.repo;
              const sha = context.sha;
              const { data: candidate } = await github.rest.repos.getCommit({ ...repo, ref: sha });
              const runId = candidate.commit.message.match(/\n\nSkippy-Release-Run: ([1-9][0-9]*)\s*$/)?.[1];
              if (!runId || candidate.parents.length !== 1 ||
                  candidate.parents[0].sha !== context.payload.before) return;
              const { data: run } = await github.rest.actions.getWorkflowRun({ ...repo, run_id: runId });
              if (run.path !== '.github/workflows/release.yml' || run.event !== 'workflow_dispatch' ||
                  run.head_branch !== 'main' || run.head_sha !== context.payload.before ||
                  run.head_repository?.full_name !== context.payload.repository.full_name) return;
              const receipt = `validated-release-${sha}`;
              const { data: result } = await github.rest.actions.listWorkflowRunArtifacts({
                ...repo, run_id: runId, name: receipt,
              });
              if (result.artifacts.some(artifact => artifact.name === receipt && !artifact.expired)) {
                core.info(`Release run ${runId} already validated ${sha}`);
                core.setOutput('verified', 'true');
              }
            } catch (error) {
              core.warning(`Release validation could not be verified. Running ordinary CI. ${error.message}`);
            }
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        if: inputs.profile == '' && github.event_name == 'pull_request'
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: paths
        if: inputs.profile == '' && github.event_name == 'pull_request'
        with:
          predicate-quantifier: some-with-excludes
          filters: .github/path-filters.yml
  plan:
    name: Validate build targets
    needs: changes
    permissions:
      contents: read
      packages: read
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.inference == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SKIPPY_CI_PROFILE: ${{ inputs.profile || (github.event_name == 'schedule' && 'full' || 'pr') }}
    outputs:
      profile: ${{ steps.plan.outputs.profile }}
      cpu_digest: ${{ steps.images.outputs.cpu }}
      cuda12_digest: ${{ steps.images.outputs.cuda12 }}
      cuda12_arm_digest: ${{ steps.images.outputs.cuda12_arm }}
      cuda13_arm_digest: ${{ steps.images.outputs.cuda13_arm }}
      runtimes: ${{ steps.plan.outputs.runtimes }}
    steps:
      - name: Validate CUDA architecture mode
        shell: bash
        run: |
          case "$SKIPPY_CUDA_ARCHITECTURE_MODE" in
            native|release) ;;
            *) echo "::error::CUDA architecture mode must be native or release."; exit 1 ;;
          esac
      - name: Admit manual source
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Ad hoc CI must run from the protected main branch."
            exit 1
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.SKIPPY_CI_SOURCE_REF }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/source
        with:
          artifact: ${{ inputs.candidate_artifact }}
          sha: ${{ inputs.candidate_sha }}
      - id: plan
        run: just ci-plan
      - name: Authenticate compiler image lookup
        if: needs.changes.outputs.code == 'true' || steps.plan.outputs.profile == 'full'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve compiler image digests
        id: images
        if: needs.changes.outputs.code == 'true' || steps.plan.outputs.profile == 'full'
        shell: bash
        env:
          PROFILE: ${{ steps.plan.outputs.profile }}
        run: |
          set -euo pipefail
          resolve() {
            local manifest digest
            manifest=$(docker buildx imagetools inspect "ghcr.io/mesh-llm/skippy-ci-$2")
            digest=$(awk '$1 == "Digest:" {print $2; exit}' <<< "$manifest")
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            echo "$1=$digest" >> "$GITHUB_OUTPUT"
          }
          resolve cpu cpu:latest
          if [[ "$PROFILE" == full ]]; then
            resolve cuda12 cuda12:latest
            resolve cuda12_arm cuda12:latest-arm64
            resolve cuda13_arm cuda13:latest-arm64
          fi
  quality:
    name: Quality canary
    needs: [changes, plan]
    if: needs.changes.outputs.code == 'true'
    env:
      CARGO_BUILD_JOBS: '2'
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      CTEST_PARALLEL_LEVEL: '2'
      CC: /usr/lib/llvm-22/bin/clang
      CXX: /usr/lib/llvm-22/bin/clang++
      SKIPPY_REWRITER_LLVM_PREFIX: /usr/lib/llvm-22
      LIBCLANG_PATH: /usr/lib/llvm-22/lib
      SKIPPY_REQUIRE_SCCACHE: '1'
      SCCACHE_GHA_ENABLED: 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/mesh-llm/skippy-ci-cpu@${{ needs.plan.outputs.cpu_digest }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    # Cold caches can take more than 30 minutes for lint and tests alone.
    timeout-minutes: ${{ needs.plan.outputs.profile == 'pr' && 60 || 180 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.SKIPPY_CI_SOURCE_REF }}
          persist-credentials: false
      - uses: ./.github/actions/source
        with:
          artifact: ${{ inputs.candidate_artifact }}
          sha: ${{ inputs.candidate_sha }}
      - run: just automation-contracts
      - name: Test inference results reporting
        run: bash scripts/tests/inference-report.sh
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.0'
          package-manager-cache: false
      - name: Test workflow result gates
        run: node --test .github/scripts/*.test.cjs
      - name: Verify image toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustc --version
          just --version
          sccache --version
          "$CC" --version
          "$CXX" --version
          "$SKIPPY_REWRITER_LLVM_PREFIX/bin/clang-format" --version
          "$SKIPPY_REWRITER_LLVM_PREFIX/bin/clang-tidy" --version
          "$SKIPPY_REWRITER_LLVM_PREFIX/bin/clang" --version
          test -r "$SKIPPY_REWRITER_LLVM_PREFIX/lib/cmake/llvm/LLVMConfig.cmake"
          test -r "$SKIPPY_REWRITER_LLVM_PREFIX/lib/cmake/clang/ClangConfig.cmake"
      - uses: ./.github/actions/cache
        with:
          scope: quality-${{ needs.plan.outputs.cpu_digest }}
          download-scope: quality-container
          build-paths: |
            target/debug
            skippy-api-rs/target/debug
      - uses: ./.github/actions/sccache
        with:
          scope: quality-${{ runner.os }}-${{ runner.arch }}
      - uses: ./.github/actions/native-source
      - run: just llama-prepare
      - run: just skippy-ffi-bindgen-check
      - id: lint
        run: just lint
      - name: Report sccache statistics before tests
        if: ${{ !cancelled() && env.SCCACHE_GHA_VERSION != '' }}
        uses: ./.github/actions/report-sccache
        with:
          phase: ${{ steps.lint.outcome == 'skipped' && 'setup' || 'lint' }}
      - id: test
        run: just test
      - name: Report sccache statistics after tests
        if: ${{ !cancelled() && (steps.test.outcome == 'success' || steps.test.outcome == 'failure') }}
        uses: ./.github/actions/report-sccache
        with:
          phase: tests
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: ${{ env.SKIPPY_ARTIFACT_SCOPE }}-quality-evidence
          path: |
            target/ci-evidence/**
            target/skippy-api-build/Testing/**
            target/skippy-llama-api-build/Testing/**
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
  native_contracts:
    name: Check llama.cpp Graph Contracts, patches, and API docs
    needs: [plan, quality]
    if: needs.plan.outputs.profile == 'full'
    runs-on:
      group: jy-rnr_vfnz8k5p4yrh334
      labels: [self-hosted, skippy-ephemeral, Linux, native-contracts]
    timeout-minutes: 180
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '4'
      CTEST_PARALLEL_LEVEL: '2'
      CC: /usr/lib/llvm-22/bin/clang
      CXX: /usr/lib/llvm-22/bin/clang++
      SKIPPY_REWRITER_LLVM_PREFIX: /usr/lib/llvm-22
      LIBCLANG_PATH: /usr/lib/llvm-22/lib
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.SKIPPY_CI_SOURCE_REF }}
          persist-credentials: false
      - uses: ./.github/actions/source
        with:
          artifact: ${{ inputs.candidate_artifact }}
          sha: ${{ inputs.candidate_sha }}
      - uses: ./.github/actions/cache
        with:
          scope: native-contracts-llvm22-cpu
          download-scope: native-contracts
      - uses: ./.github/actions/sccache
        with:
          scope: native-contracts-${{ runner.os }}-${{ runner.arch }}-llvm22-cpu
      - uses: ./.github/actions/native-source
      - run: just llama-check
      - uses: ./.github/actions/report-sccache
        if: ${{ !cancelled() && env.SCCACHE_GHA_VERSION != '' }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: ${{ env.SKIPPY_ARTIFACT_SCOPE }}-native-contracts-evidence
          path: |
            target/ci-evidence/sccache-build.json
            target/skippy-stage-rewriter-check/*.log
            target/skippy-stage-rewriter-check/report*
            target/skippy-stage-rewriter-check/patch-drift.diff
            target/skippy-stage-rewriter-check/changed-family-selection.json
            target/skippy-stage-rewriter-check/generated-family-shards/**
            target/skippy-stage-rewriter-check/tool-build/Testing/**
            .deps/llama-build/**/Testing/**
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
  package_darwin_aarch64_cpu:
    name: Build, package, and smoke · macOS ARM64 CPU
    needs: [plan, quality]
    if: needs.plan.outputs.profile == 'full'
    runs-on: macos-15
    timeout-minutes: 240
    env:
      SKIPPY_CI_PROFILE: ${{ needs.plan.outputs.profile }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.SKIPPY_CI_SOURCE_REF }}
          persist-credentials: false
      - uses: ./.github/actions/ci-package
        with:
          runtime-id: darwin-aarch64-cpu
          host-id: darwin-aarch64
          build-cli: 'true'
          candidate-artifact: ${{ inputs.candidate_artifact }}
          candidate-sha: ${{ inputs.candidate_sha }}
  package_darwin_aarch64_metal:
    name: Build, package, and smoke · macOS ARM64 Metal
    needs: [plan, quality, package_darwin_aarch64_cpu, changes]
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success' &&
      ((needs.changes.outputs.code == 'true' && needs.quality.result == 'success') ||
      (needs.changes.outputs.code == 'false' && needs.quality.result == 'skipped')) &&
      ((needs.plan.outputs.profile == 'full' && needs.package_darwin_aarch64_cpu.result == 'success') ||
      (needs.plan.outputs.profile == 'pr' && needs.changes.outputs.inference == 'true')) }}
    runs-on:
      group: jy-rnr_h7x5s2yx9gtkz3c
      labels: ["self-hosted", "skippy-ephemeral", "macOS", "ARM64", "metal"]
    timeout-minutes: 240
    env:
      SKIPPY_CI_PROFILE: ${{ needs.plan.outputs.profile }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.SKIPPY_CI_SOURCE_REF }}
          persist-credentials: false
      - uses: ./.github/actions/ci-package
        with:
          runtime-id: darwin-aarch64-metal
          host-id: darwin-aarch64
          build-cli: ${{ needs.plan.outputs.profile == 'pr' }}
          candidate-artifact: ${{ inputs.candidate_artifact }}
          candidate-sha: ${{ inputs.candidate_sha }}
  package_linux_x86_64_cpu:
    name: Build, package, and smoke · Linux x64 CPU
    needs: [plan, quality]
    if: needs.plan.outputs.profile == 'full'
    # The shared CLI must also run in the Ubuntu 24.04 CUDA toolchain images.
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      SKIPPY_CI_PROFILE: ${{ needs.plan.outputs.profile }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.SKIPPY_CI_SOURCE_REF }}
          persist-credentials: false
      - uses: ./.github/actions/ci-package
        with:
          runtime-id: linux-x86_64-cpu
          host-id: linux-x86_64
          build-cli: 'true'
          candidate-artifact: ${{ inputs.candidate_artifact }}
          candidate-sha: ${{ inputs.candidate_sha }}
  package_linux_x86_64_cuda12:
    name: Build, package, and smoke · Linux x64 CUDA 12
    needs: [plan, quality, package_linux_x86_64_cpu]
    if: needs.plan.outputs.profile == 'full'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/mesh-llm/skippy-ci-cuda12@${{ needs.plan.outputs.cuda12_digest }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 240
    env:
      SKIPPY_CI_PROFILE: ${{ needs.plan.outputs.profile }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.SKIPPY_CI_SOURCE_REF }}
          persist-credentials: false
      - uses: ./.github/actions/ci-package
        with:
          runtime-id: linux-x86_64-cuda12
          host-id: linux-x86_64
          smoke: artifact
          compiler-image-digest: ${{ needs.plan.outputs.cuda12_digest }}
          candidate-artifact: ${{ inputs.candidate_artifact }}
          candidate-sha: ${{ inputs.candidate_sha }}
  release_smoke_linux_x86_64_cuda12:
    name: Release GPU smoke · Linux x64 CUDA 12
    needs: [package_linux_x86_64_cuda12]
    if: inputs.artifact_scope == 'release'
    runs-on:
      group: jy-rnr_btc4xhvks1eer0j
      labels: ["self-hosted", "skippy-ephemeral", "Linux", "X64", "runtime-image", "cuda12"]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.SKIPPY_CI_SOURCE_REF }}
          persist-credentials: false
      - uses: ./.github/actions/ci-smoke
        with:
          runtime_id: linux-x86_64-cuda12
          download-package: 'true'
          candidate_artifact: ${{ inputs.candidate_artifact }}
          candidate_sha: ${{ inputs.candidate_sha }}
  package_linux_x86_64_cuda13:
    name: Build, package, and smoke · Linux x64 CUDA 13
    needs: [plan, quality, package_linux_x86_64_cpu, changes]
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success' &&
      ((needs.changes.outputs.code == 'true' && needs.quality.result == 'success') ||
      (needs.changes.outputs.code == 'false' && needs.quality.result == 'skipped')) &&
      ((needs.plan.outputs.profile == 'full' && needs.package_linux_x86_64_cpu.result == 'success') ||
      (needs.plan.outputs.profile == 'pr' && needs.changes.outputs.inference == 'true')) }}
    runs-on:
      group: jy-rnr_p0zx3thw895vrka
      labels: ["self-hosted", "skippy-ephemeral", "Linux", "X64", "runtime-image", "cuda13"]
    timeout-minutes: 240
    env:
      SKIPPY_CI_PROFILE: ${{ needs.plan.outputs.profile }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.SKIPPY_CI_SOURCE_REF }}
          persist-credentials: false
      - uses: ./.github/actions/ci-package
        with:
          runtime-id: linux-x86_64-cuda13
          host-id: linux-x86_64
          build-cli: ${{ needs.plan.outputs.profile == 'pr' }}
          candidate-artifact: ${{ inputs.candidate_artifact }}
          candidate-sha: ${{ inputs.candidate_sha }}
  package_linux_aarch64_cpu:
    name: Build, package, and smoke · Linux ARM64 CPU
    needs: [plan, quality]
    if: needs.plan.outputs.profile == 'full'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    env:
      SKIPPY_CI_PROFILE: ${{ needs.plan.outputs.profile }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.SKIPPY_CI_SOURCE_REF }}
          persist-credentials: false
      - uses: ./.github/actions/ci-package
        with:
          runtime-id: linux-aarch64-cpu
          host-id: linux-aarch64
          build-cli: 'true'
          candidate-artifact: ${{ inputs.candidate_artifact }}
          candidate-sha: ${{ inputs.candidate_sha }}
  package_linux_aarch64_cuda12:
    name: Build, package, and smoke · Linux ARM64 CUDA 12
    needs: [plan, quality, package_linux_aarch64_cpu]
    if: needs.plan.outputs.profile == 'full'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/mesh-llm/skippy-ci-cuda12@${{ needs.plan.outputs.cuda12_arm_digest }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 240
    env:
      SKIPPY_CI_PROFILE: ${{ needs.plan.outputs.profile }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.SKIPPY_CI_SOURCE_REF }}
          persist-credentials: false
      - uses: ./.github/actions/ci-package
        with:
          runtime-id: linux-aarch64-cuda12
          host-id: linux-aarch64
          smoke: artifact
