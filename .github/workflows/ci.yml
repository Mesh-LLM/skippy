    if: needs.plan.outputs.profile == 'full'
    runs-on:
      group: jy-rnr_p0zx3thw895vrka
      labels: ["self-hosted", "skippy-ephemeral", "Linux", "X64", "runtime-image", "cuda13"]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-smoke
        with:
          runtime_id: linux-x86_64-cuda13
          candidate_artifact: ${{ inputs.candidate_artifact }}
          candidate_sha: ${{ inputs.candidate_sha }}
  smoke_linux_aarch64_cpu:
    name: Test · Linux ARM64 · CPU
    needs: [plan, product]
    if: needs.plan.outputs.profile == 'full'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-smoke
        with:
          runtime_id: linux-aarch64-cpu
          candidate_artifact: ${{ inputs.candidate_artifact }}
          candidate_sha: ${{ inputs.candidate_sha }}
  smoke_linux_aarch64_cuda12:
    name: Test · Linux ARM64 · CUDA 12
    needs: [plan, product]
    if: needs.plan.outputs.profile == 'full'
    runs-on:
      group: jy-rnr_pg90ves41xbxvwy
      labels: ["self-hosted", "skippy-ephemeral", "Linux", "ARM64", "runtime-image", "cuda12"]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-smoke
        with:
          runtime_id: linux-aarch64-cuda12
          candidate_artifact: ${{ inputs.candidate_artifact }}
          candidate_sha: ${{ inputs.candidate_sha }}
  smoke_linux_aarch64_cuda13:
    name: Test · Linux ARM64 · CUDA 13
    needs: [plan, product]
    if: needs.plan.outputs.profile == 'full'
    runs-on:
      group: jy-rnr_8gvzbe9b9d79y0k
      labels: ["self-hosted", "skippy-ephemeral", "Linux", "ARM64", "runtime-image", "cuda13"]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
