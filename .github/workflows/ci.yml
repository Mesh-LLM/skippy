  runtime_linux_aarch64_cpu:
    name: Build & test Runtime (Linux ARM64, CPU)
    needs: plan
    if: needs.plan.outputs.profile == 'full'
    runs-on: ${{ inputs.jy_runners && fromJSON('{"group":"jy-rnr_8gvzbe9b9d79y0k","labels":["self-hosted","skippy-ephemeral","Linux","ARM64","runtime-image"]}') || 'ubuntu-24.04-arm' }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-runtime
        with:
          runtime_id: linux-aarch64-cpu
