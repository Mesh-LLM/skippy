      - uses: ./.github/actions/ci-smoke
        with:
          runtime_id: linux-aarch64-cuda13
          candidate_artifact: ${{ inputs.candidate_artifact }}
          candidate_sha: ${{ inputs.candidate_sha }}
  smoke:
    name: Verify packaged runtime tests
    needs: [plan, smoke_darwin_aarch64_cpu, smoke_darwin_aarch64_metal, smoke_linux_x86_64_cpu, smoke_linux_x86_64_cuda12, smoke_linux_x86_64_cuda13, smoke_linux_aarch64_cpu, smoke_linux_aarch64_cuda12, smoke_linux_aarch64_cuda13]
    if: always() && needs.plan.outputs.profile == 'full'
    runs-on: ${{ inputs.jy_runners && fromJSON('{"group":"jy-rnr_vfnz8k5p4yrh334","labels":["self-hosted","jy-linux-docker","Linux","X64"]}') || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: just automation-run ci smoke-summary
        env:
          SKIPPY_CI_NEEDS: ${{ toJSON(needs) }}
  summary:
    name: ${{ needs.plan.outputs.profile == 'full' && 'Full qualification' || 'CI' }}
    needs: [plan, inference_contracts, quality, host, runtime, product, smoke]
    if: always()
    runs-on: ${{ inputs.jy_runners && fromJSON('{"group":"jy-rnr_vfnz8k5p4yrh334","labels":["self-hosted","jy-linux-docker","Linux","X64"]}') || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: just ci-summary
        env:
          SKIPPY_CI_PROFILE: ${{ needs.plan.outputs.profile }}
          SKIPPY_CI_NEEDS: ${{ toJSON(needs) }}
