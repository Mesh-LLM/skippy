name: CI
on:
  pull_request:
    # Include the inference-only inputs as well as the code filter.
    paths:
      - 'crates/**'
      - 'skippy-api-rs/**'
      - 'skippy_api/**'
      - 'llama_cpp/**'
      - 'tools/**'
      - 'scripts/**'
      - '.cargo/**'
      - '.github/actions/**'
      - '.github/scripts/**'
      - '.github/path-filters.yml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/inference.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'Justfile'
      - 'ci/targets.json'
      - 'ci/llama-canary/**'
      - '.gi/templates.yaml'
      - 'ci/inference-ladder.json'
      - 'ci/inference-artifacts.json'
      - 'ci/inference-quality.json'
      - '!**/*.md'
      - '!**/*.mdx'
      - '!**/*.rst'
      - '!**/*.adoc'
      - '!**/docs/**'
      - '!docs-site/**'
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'skippy-api-rs/**'
      - 'skippy_api/**'
      - 'llama_cpp/**'
      - 'tools/**'
      - 'scripts/**'
      - '.cargo/**'
      - '.github/actions/**'
      - '.github/scripts/**'
      - '.github/path-filters.yml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/inference.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'Justfile'
      - 'ci/targets.json'
      - 'ci/llama-canary/**'
      - '!**/*.md'
      - '!**/*.mdx'
      - '!**/*.rst'
      - '!**/*.adoc'
      - '!**/docs/**'
      - '!docs-site/**'
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      profile:
        description: Short checks or complete native/package qualification
        type: choice
        options: [pr, full]
        default: full
      cuda_architecture_mode:
        description: CUDA architectures for the assigned GPU or the release architecture set
        type: choice
        options: [native, release]
        default: native
  workflow_call:
    inputs:
      profile:
        type: string
        default: full
      cuda_architecture_mode:
        type: string
        default: release
      artifact_scope:
        type: string
        default: ci
      candidate_artifact:
        type: string
        default: ''
      candidate_sha:
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: skippy-ci-${{ github.workflow }}-${{ inputs.artifact_scope || 'ci' }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_PROFILE_RELEASE_DEBUG: '0'
  CARGO_PROFILE_BENCH_DEBUG: '0'
  SCCACHE_GHA_ENABLED: 'true'
  SKIPPY_REQUIRE_SCCACHE: '1'
  SKIPPY_CUDA_ARCHITECTURE_MODE: ${{ inputs.cuda_architecture_mode || 'native' }}
  SKIPPY_ARTIFACT_SCOPE: ${{ inputs.artifact_scope || 'ci' }}
jobs:
  changes:
    name: Select checks by path
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ inputs.profile != '' || github.event_name != 'pull_request' || steps.paths.outputs.code == 'true' }}
      inference: ${{ inputs.profile == '' && github.event_name == 'pull_request' && steps.paths.outputs.inference == 'true' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        if: inputs.profile == '' && github.event_name == 'pull_request'
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: paths
        if: inputs.profile == '' && github.event_name == 'pull_request'
        with:
          predicate-quantifier: some-with-excludes
          filters: .github/path-filters.yml
  plan:
    name: Validate build targets
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.inference == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SKIPPY_CI_PROFILE: ${{ inputs.profile || (github.event_name == 'schedule' && 'full' || 'pr') }}
    outputs:
      profile: ${{ steps.plan.outputs.profile }}
      runtimes: ${{ steps.plan.outputs.runtimes }}
    steps:
      - name: Validate CUDA architecture mode
        shell: bash
        run: |
          case "$SKIPPY_CUDA_ARCHITECTURE_MODE" in
            native|release) ;;
            *) echo "::error::CUDA architecture mode must be native or release."; exit 1 ;;
          esac
      - name: Admit manual source
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Ad hoc CI must run from the protected main branch."
            exit 1
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/source
        with:
          artifact: ${{ inputs.candidate_artifact }}
          sha: ${{ inputs.candidate_sha }}
      - id: plan
        run: just ci-plan
  automation:
    name: Test xtask and CI automation
    needs: [changes, plan]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/source
        with:
          artifact: ${{ inputs.candidate_artifact }}
          sha: ${{ inputs.candidate_sha }}
      - run: just inference-tool-check
      - name: Test inference results reporting
        run: bash scripts/tests/inference-report.sh
      - name: Test workflow result gates
        run: node --test .github/scripts/*.test.cjs
  quality:
    name: Quality canary
    needs: [changes, plan]
    if: needs.changes.outputs.code == 'true'
    env:
      CARGO_BUILD_JOBS: '2'
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      CTEST_PARALLEL_LEVEL: '2'
      CC: /usr/lib/llvm-22/bin/clang
      CXX: /usr/lib/llvm-22/bin/clang++
      SKIPPY_REWRITER_LLVM_PREFIX: /usr/lib/llvm-22
      LIBCLANG_PATH: /usr/lib/llvm-22/lib
      SKIPPY_REQUIRE_SCCACHE: '1'
      SCCACHE_GHA_ENABLED: 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/general-inference/skippy-ci-cpu:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    # Cold caches can take more than 30 minutes for lint and tests alone.
    timeout-minutes: ${{ needs.plan.outputs.profile == 'pr' && 60 || 180 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Verify image toolchain and cache identity
        shell: bash
        run: |
          set -euo pipefail
          rustc --version
          just --version
          sccache --version
          "$CC" --version
          "$CXX" --version
          "$SKIPPY_REWRITER_LLVM_PREFIX/bin/clang-format" --version
          "$SKIPPY_REWRITER_LLVM_PREFIX/bin/clang-tidy" --version
          "$SKIPPY_REWRITER_LLVM_PREFIX/bin/clang" --version
          test -r "$SKIPPY_REWRITER_LLVM_PREFIX/lib/cmake/llvm/LLVMConfig.cmake"
          test -r "$SKIPPY_REWRITER_LLVM_PREFIX/lib/cmake/clang/ClangConfig.cmake"
          image_id="$(cat /etc/skippy-ci-image-id)"
          test -n "$image_id"
          echo "SKIPPY_TOOLCHAIN_CACHE_KEY=$image_id" >> "$GITHUB_ENV"
      - uses: ./.github/actions/source
        # Protected admission runs before GitHub compiler-cache credentials are exported.
        env:
          RUSTC_WRAPPER: ''
        with:
          artifact: ${{ inputs.candidate_artifact }}
          sha: ${{ inputs.candidate_sha }}
          cache-scope: quality-container-${{ env.SKIPPY_TOOLCHAIN_CACHE_KEY }}-admission
          download-scope: quality-container-admission
      - uses: ./.github/actions/cache
        with:
          scope: quality-${{ env.SKIPPY_TOOLCHAIN_CACHE_KEY }}
          download-scope: quality-container
          build-paths: |
            target/debug
            skippy-api-rs/target/debug
      - uses: ./.github/actions/sccache
        with:
          scope: quality-${{ runner.os }}-${{ runner.arch }}-${{ env.SKIPPY_TOOLCHAIN_CACHE_KEY }}
      - uses: ./.github/actions/native-source
      - run: just llama-prepare
      - run: just skippy-ffi-bindgen-check
      - run: just lint
      - run: just test
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: ${{ env.SKIPPY_ARTIFACT_SCOPE }}-quality-evidence
          path: |
            target/ci-evidence/**
            target/skippy-api-build/Testing/**
            target/skippy-llama-api-build/Testing/**
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
  native_contracts:
    name: Check llama.cpp Graph Contracts, patches, and API docs
    needs: [plan, quality, automation]
    if: needs.plan.outputs.profile == 'full'
    runs-on:
      group: jy-rnr_vfnz8k5p4yrh334
      labels: [self-hosted, skippy-ephemeral, Linux, native-contracts]
    timeout-minutes: 180
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '4'
      CTEST_PARALLEL_LEVEL: '2'
      CC: /usr/lib/llvm-22/bin/clang
      CXX: /usr/lib/llvm-22/bin/clang++
      SKIPPY_REWRITER_LLVM_PREFIX: /usr/lib/llvm-22
      LIBCLANG_PATH: /usr/lib/llvm-22/lib
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/source
        env:
          RUSTC_WRAPPER: ''
        with:
          artifact: ${{ inputs.candidate_artifact }}
          sha: ${{ inputs.candidate_sha }}
          cache-scope: native-contracts-llvm22-admission
          download-scope: native-contracts
      - uses: ./.github/actions/cache
        with:
          scope: native-contracts-llvm22-cpu
          download-scope: native-contracts
      - uses: ./.github/actions/sccache
        with:
          scope: native-contracts-${{ runner.os }}-${{ runner.arch }}-llvm22-cpu
      - uses: ./.github/actions/native-source
      - run: just llama-check
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: ${{ env.SKIPPY_ARTIFACT_SCOPE }}-native-contracts-evidence
          path: |
            target/skippy-stage-rewriter-check/*.log
            target/skippy-stage-rewriter-check/report*
            target/skippy-stage-rewriter-check/patch-drift.diff
            target/skippy-stage-rewriter-check/changed-family-selection.json
            target/skippy-stage-rewriter-check/generated-family-shards/**
            target/skippy-stage-rewriter-check/tool-build/Testing/**
            .deps/llama-build/**/Testing/**
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
  package_darwin_aarch64_cpu:
    name: Build, package, and smoke · macOS ARM64 CPU
    needs: [plan, quality, automation]
    if: needs.plan.outputs.profile == 'full'
    runs-on: macos-15
    timeout-minutes: 240
    env:
      SKIPPY_CI_PROFILE: ${{ needs.plan.outputs.profile }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-package
        with:
          runtime-id: darwin-aarch64-cpu
          host-id: darwin-aarch64
          build-cli: 'true'
          candidate-artifact: ${{ inputs.candidate_artifact }}
          candidate-sha: ${{ inputs.candidate_sha }}
  package_darwin_aarch64_metal:
    name: Build, package, and smoke · macOS ARM64 Metal
    needs: [plan, quality, automation, package_darwin_aarch64_cpu, changes]
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success' &&
      ((needs.changes.outputs.code == 'true' && needs.quality.result == 'success' && needs.automation.result == 'success') ||
      (needs.changes.outputs.code == 'false' && needs.quality.result == 'skipped' && needs.automation.result == 'skipped')) &&
      ((needs.plan.outputs.profile == 'full' && needs.package_darwin_aarch64_cpu.result == 'success') ||
      (needs.plan.outputs.profile == 'pr' && needs.changes.outputs.inference == 'true')) }}
    runs-on:
      group: jy-rnr_h7x5s2yx9gtkz3c
      labels: ["self-hosted", "skippy-ephemeral", "macOS", "ARM64", "metal"]
    timeout-minutes: 240
    env:
      SKIPPY_CI_PROFILE: ${{ needs.plan.outputs.profile }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-package
        with:
          runtime-id: darwin-aarch64-metal
          host-id: darwin-aarch64
          build-cli: ${{ needs.plan.outputs.profile == 'pr' }}
          candidate-artifact: ${{ inputs.candidate_artifact }}
          candidate-sha: ${{ inputs.candidate_sha }}
  package_linux_x86_64_cpu:
    name: Build, package, and smoke · Linux x64 CPU
    needs: [plan, quality, automation]
    if: needs.plan.outputs.profile == 'full'
    # The shared CLI must also run in the Ubuntu 24.04 CUDA toolchain images.
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      SKIPPY_CI_PROFILE: ${{ needs.plan.outputs.profile }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-package
        with:
          runtime-id: linux-x86_64-cpu
          host-id: linux-x86_64
          build-cli: 'true'
          candidate-artifact: ${{ inputs.candidate_artifact }}
          candidate-sha: ${{ inputs.candidate_sha }}
  package_linux_x86_64_cuda12:
    name: Build, package, and smoke · Linux x64 CUDA 12
    needs: [plan, quality, automation, package_linux_x86_64_cpu]
    if: needs.plan.outputs.profile == 'full'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/general-inference/skippy-ci-cuda12:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 240
    env:
      SKIPPY_CI_PROFILE: ${{ needs.plan.outputs.profile }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-package
        with:
          runtime-id: linux-x86_64-cuda12
          host-id: linux-x86_64
          smoke: artifact
          containerized: 'true'
          candidate-artifact: ${{ inputs.candidate_artifact }}
          candidate-sha: ${{ inputs.candidate_sha }}
  release_smoke_linux_x86_64_cuda12:
    name: Release GPU smoke · Linux x64 CUDA 12
    needs: [package_linux_x86_64_cuda12]
    if: inputs.artifact_scope == 'release'
    runs-on:
      group: jy-rnr_btc4xhvks1eer0j
      labels: ["self-hosted", "skippy-ephemeral", "Linux", "X64", "runtime-image", "cuda12"]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-smoke
        with:
          runtime_id: linux-x86_64-cuda12
          download-package: 'true'
          candidate_artifact: ${{ inputs.candidate_artifact }}
          candidate_sha: ${{ inputs.candidate_sha }}
  package_linux_x86_64_cuda13:
    name: Build, package, and smoke · Linux x64 CUDA 13
    needs: [plan, quality, automation, package_linux_x86_64_cpu, changes]
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success' &&
      ((needs.changes.outputs.code == 'true' && needs.quality.result == 'success' && needs.automation.result == 'success') ||
      (needs.changes.outputs.code == 'false' && needs.quality.result == 'skipped' && needs.automation.result == 'skipped')) &&
      ((needs.plan.outputs.profile == 'full' && needs.package_linux_x86_64_cpu.result == 'success') ||
      (needs.plan.outputs.profile == 'pr' && needs.changes.outputs.inference == 'true')) }}
    runs-on:
      group: jy-rnr_p0zx3thw895vrka
      labels: ["self-hosted", "skippy-ephemeral", "Linux", "X64", "runtime-image", "cuda13"]
    timeout-minutes: 240
    env:
      SKIPPY_CI_PROFILE: ${{ needs.plan.outputs.profile }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-package
        with:
          runtime-id: linux-x86_64-cuda13
          host-id: linux-x86_64
          build-cli: ${{ needs.plan.outputs.profile == 'pr' }}
          candidate-artifact: ${{ inputs.candidate_artifact }}
          candidate-sha: ${{ inputs.candidate_sha }}
  package_linux_aarch64_cpu:
    name: Build, package, and smoke · Linux ARM64 CPU
    needs: [plan, quality, automation]
    if: needs.plan.outputs.profile == 'full'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    env:
      SKIPPY_CI_PROFILE: ${{ needs.plan.outputs.profile }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-package
        with:
          runtime-id: linux-aarch64-cpu
          host-id: linux-aarch64
          build-cli: 'true'
          candidate-artifact: ${{ inputs.candidate_artifact }}
          candidate-sha: ${{ inputs.candidate_sha }}
  package_linux_aarch64_cuda12:
    name: Build, package, and smoke · Linux ARM64 CUDA 12
    needs: [plan, quality, automation, package_linux_aarch64_cpu]
    if: needs.plan.outputs.profile == 'full'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/general-inference/skippy-ci-cuda12:latest-arm64
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 240
    env:
      SKIPPY_CI_PROFILE: ${{ needs.plan.outputs.profile }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-package
        with:
          runtime-id: linux-aarch64-cuda12
          host-id: linux-aarch64
          smoke: artifact
          containerized: 'true'
          candidate-artifact: ${{ inputs.candidate_artifact }}
          candidate-sha: ${{ inputs.candidate_sha }}
  release_smoke_linux_aarch64_cuda12:
    name: Release GPU smoke · Linux ARM64 CUDA 12
    needs: [package_linux_aarch64_cuda12]
    if: inputs.artifact_scope == 'release'
    runs-on:
      group: jy-rnr_pg90ves41xbxvwy
      labels: ["self-hosted", "skippy-ephemeral", "Linux", "ARM64", "runtime-image", "cuda12"]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-smoke
        with:
          runtime_id: linux-aarch64-cuda12
          download-package: 'true'
          candidate_artifact: ${{ inputs.candidate_artifact }}
          candidate_sha: ${{ inputs.candidate_sha }}
  package_linux_aarch64_cuda13:
    name: Build, package, and smoke · Linux ARM64 CUDA 13
    needs: [plan, quality, automation, package_linux_aarch64_cpu]
    if: needs.plan.outputs.profile == 'full'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/general-inference/skippy-ci-cuda13:latest-arm64
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 240
    env:
      SKIPPY_CI_PROFILE: ${{ needs.plan.outputs.profile }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-package
        with:
          runtime-id: linux-aarch64-cuda13
          host-id: linux-aarch64
          smoke: artifact
          containerized: 'true'
          candidate-artifact: ${{ inputs.candidate_artifact }}
          candidate-sha: ${{ inputs.candidate_sha }}
  release_smoke_linux_aarch64_cuda13:
    name: Release GPU smoke · Linux ARM64 CUDA 13
    needs: [package_linux_aarch64_cuda13]
    if: inputs.artifact_scope == 'release'
    runs-on:
      group: jy-rnr_8gvzbe9b9d79y0k
      labels: ["self-hosted", "skippy-ephemeral", "Linux", "ARM64", "runtime-image", "cuda13"]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-smoke
        with:
          runtime_id: linux-aarch64-cuda13
          download-package: 'true'
          candidate_artifact: ${{ inputs.candidate_artifact }}
          candidate_sha: ${{ inputs.candidate_sha }}
  gate:
    name: ${{ needs.plan.outputs.profile == 'full' && 'Full CI gate' || 'CI' }}
    needs: [
      changes, plan, automation, quality, native_contracts,
      package_darwin_aarch64_cpu, package_darwin_aarch64_metal,
      package_linux_x86_64_cpu, package_linux_x86_64_cuda12, package_linux_x86_64_cuda13,
      package_linux_aarch64_cpu, package_linux_aarch64_cuda12, package_linux_aarch64_cuda13,
      release_smoke_linux_x86_64_cuda12, release_smoke_linux_aarch64_cuda12, release_smoke_linux_aarch64_cuda13
    ]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          CHECK_RESULTS: ${{ toJSON(needs) }}
          RELEASE_SMOKE: ${{ inputs.artifact_scope == 'release' }}
        with:
          script: |
            const needs = JSON.parse(process.env.CHECK_RESULTS);
            const paths = needs.changes?.outputs;
            if (needs.changes?.result !== 'success' ||
                !['true', 'false'].includes(paths?.code) ||
                !['true', 'false'].includes(paths?.inference)) {
              throw new Error('Path selection failed or did not report all decisions');
            }
            const inference = paths.inference === 'true';
            const code = paths.code === 'true';
            const selected = code || inference;
            const profile = needs.plan?.outputs?.profile;
            if (selected && !['pr', 'full'].includes(profile)) throw new Error('Missing or invalid CI profile');
            const full = selected && profile === 'full';
            const release = process.env.RELEASE_SMOKE === 'true';
            if (release && !full) throw new Error('Release validation requires full CI');

            const prPackages = ['package_darwin_aarch64_metal', 'package_linux_x86_64_cuda13'];
            const releaseSmokes = ['release_smoke_linux_x86_64_cuda12', 'release_smoke_linux_aarch64_cuda12', 'release_smoke_linux_aarch64_cuda13'];
            const packageJobs = Object.keys(needs).filter(job => job.startsWith('package_'));
            if (selected) {
              const rows = JSON.parse(needs.plan.outputs.runtimes).include;
              const matrixJobs = rows.map(row => 'package_' + row.id.replaceAll('-', '_'));
              if (matrixJobs.length === 0 ||
                  matrixJobs.length !== packageJobs.length || new Set(matrixJobs).size !== matrixJobs.length ||
                  matrixJobs.some(job => !packageJobs.includes(job))) {
                throw new Error('Package jobs do not match the active runtime matrix');
              }
            }

            const requireResult = (job, required) => {
              const expected = required ? 'success' : 'skipped';
              if (needs[job]?.result !== expected) {
                throw new Error(`${job} must be ${expected}; got ${needs[job]?.result}`);
              }
            };
            requireResult('plan', selected);
            for (const job of ['automation', 'quality']) requireResult(job, code);
            requireResult('native_contracts', full);
            for (const job of prPackages) if (!packageJobs.includes(job)) throw new Error(`Missing package job ${job}`);
            for (const job of packageJobs) requireResult(job, full || (inference && prPackages.includes(job)));
            for (const job of releaseSmokes) requireResult(job, release);
