name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      artifact_scope:
        type: string
        default: ci
      candidate_artifact:
        type: string
        default: ''
      candidate_sha:
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: skippy-ci-${{ github.workflow }}-${{ inputs.artifact_scope || 'ci' }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_PROFILE_RELEASE_DEBUG: '0'
  CARGO_PROFILE_BENCH_DEBUG: '0'
  SKIPPY_ARTIFACT_SCOPE: ${{ inputs.artifact_scope || 'ci' }}
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      hosts: ${{ steps.plan.outputs.hosts }}
      runtimes: ${{ steps.plan.outputs.runtimes }}
      graph_required: ${{ steps.graph.outputs.graph_required }}
      graph_reason: ${{ steps.graph.outputs.graph_reason }}
    steps:
      - name: Admit manual source
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Ad hoc CI must run from the protected main branch."
            exit 1
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        name: Validate and project the release matrix
        run: scripts/ci-plan.sh
      - id: graph
        name: Classify native graph impact
        env:
          SKIPPY_CI_EVENT: ${{ github.event_name }}
          SKIPPY_CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SKIPPY_CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/ci-graph-impact.sh

  quality:
    name: Linux CPU quality gate
    needs: preflight
    runs-on:
      group: jy-rnr_vfnz8k5p4yrh334
      labels: [self-hosted, jy-linux-docker, Linux]
    env:
      SKIPPY_REWRITER_LLVM_PREFIX: /usr/lib/llvm-22
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        if: runner.environment == 'github-hosted'
      - uses: ./.github/actions/source
        with:
          artifact: ${{ inputs.candidate_artifact }}
          sha: ${{ inputs.candidate_sha }}
      - name: Lint both Rust workspaces
        run: just lint
      - name: Validate standalone repository contracts
        run: just ci-contracts
      - name: Run Rust and core API tests once
        run: just test
      - name: Build Linux CPU llama and run graph contracts once
        if: needs.preflight.outputs.graph_required == 'true'
        run: just llama-check
      - uses: actions/upload-artifact@b7c566a772e6bfb58ed0dc250532a479d7789f # v6.0.0
        if: failure()
        with:
          name: ${{ env.SKIPPY_ARTIFACT_SCOPE }}-quality-evidence
          path: |
            target/ci-evidence/**
            target/skippy-stage-rewriter-check/report*
            target/skippy-stage-rewriter-check/patch-drift.diff
            target/skippy-stage-rewriter-check/changed-family-selection.json
            target/skippy-stage-rewriter-check/generated-family-shards/**
            target/skippy-stage-rewriter-check/tool-build/Testing/**
            .deps/llama-build/**/Testing/**
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  host:
    needs: [preflight, quality]
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.preflight.outputs.hosts) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        if: runner.environment == 'github-hosted'
      - uses: ./.github/actions/source
        with:
          artifact: ${{ inputs.candidate_artifact }}
          sha: ${{ inputs.candidate_sha }}
      - name: Build backend-neutral host
        shell: bash
        env:
          HOST_ID: ${{ matrix.id }}
        run: just ci-host "$HOST_ID"
      - uses: actions/upload-artifact@b7c566a772e6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ env.SKIPPY_ARTIFACT_SCOPE }}-host-${{ matrix.id }}
          path: dist/hosts/${{ matrix.id }}
          if-no-files-found: error
          retention-days: 7

  runtime:
    needs: [preflight, quality, host]
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.preflight.outputs.runtimes) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        if: runner.environment == 'github-hosted'
      - uses: ./.github/actions/source
        with:
          artifact: ${{ inputs.candidate_artifact }}
          sha: ${{ inputs.candidate_sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.SKIPPY_ARTIFACT_SCOPE }}-host-${{ matrix.host }}
          path: inputs/host
      - name: Build native runtime without graph suites
        shell: bash
        env:
          RUNTIME_ID: ${{ matrix.id }}
        run: just ci-runtime "$RUNTIME_ID"
      - name: Compose exact host and runtime producers
        shell: bash
        env:
          RUNTIME_ID: ${{ matrix.id }}
        run: just ci-package "$RUNTIME_ID" inputs/host "dist/runtimes/$RUNTIME_ID"
      - name: Admit pinned Qwen3 fixture
        run: just automation-run ci model-fetch
        shell: bash
      - name: Execute packaged Qwen3 on the required backend
        shell: bash
        env:
          RUNTIME_ID: ${{ matrix.id }}
        run: just ci-smoke "$RUNTIME_ID" "dist/products/$RUNTIME_ID"
      - name: Retain bounded failure diagnostics
        uses: actions/upload-artifact@b7c566a772e6bfb58ed0dc250532a479d7789f # v6.0.0
        if: failure()
        with:
          name: ${{ env.SKIPPY_ARTIFACT_SCOPE }}-runtime-${{ matrix.id }}-diagnostics
          path: |
            .deps/llama-build/**/CMakeCache.txt
            .deps/llama-build/**/CMakeFiles/CMakeConfigureLog.yaml
            .deps/llama-build/**/Testing/**
            dist/products/${{ matrix.id }}/evidence/**
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@b7c566a772e6bfb58ed0dc250532a479d7789f # v6.0.0
        if: success()
        with:
          name: ${{ env.SKIPPY_ARTIFACT_SCOPE }}-product-${{ matrix.id }}
          path: dist/products/${{ matrix.id }}
          if-no-files-found: error
          retention-days: 7

  summary:
    name: CI
    needs: [preflight, quality, host, runtime]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every CI phase
        shell: bash
        env:
          SKIPPY_CI_NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -e '
            length == 4
            and all(.preflight, .quality, .host, .runtime; .result == "success")
          ' <<< "$SKIPPY_CI_NEEDS" >/dev/null
