  runtime_linux_aarch64_cpu:
    name: Build · Linux ARM64 · CPU
    needs: plan
    if: needs.plan.outputs.profile == 'full'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
