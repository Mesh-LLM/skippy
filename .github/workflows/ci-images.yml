name: CI images
on:
  pull_request:
    paths: ['.github/workflows/ci-images.yml', '.github/workflows/ci-images-pr.yml', '.github/workflows/ci-image-builds.yml', 'ci/image-targets.json', 'ci/Dockerfile*', 'ci/targets.json', 'rust-toolchain.toml', 'Justfile']
  push:
    branches: [main]
    paths: ['.github/workflows/ci-images.yml', '.github/workflows/ci-images-pr.yml', '.github/workflows/ci-image-builds.yml', 'ci/image-targets.json', 'ci/Dockerfile*', 'ci/targets.json', 'rust-toolchain.toml', 'Justfile']
  workflow_dispatch:
    inputs:
      build_only:
        description: Build and test images without publishing
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: skippy-ci-images-${{ github.workflow }}-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  cpu-build:
    if: github.event_name != 'pull_request' || vars.SKIPPY_DEPOT_RUNNERS_ENABLED != 'true'
    uses: ./.github/workflows/ci-image-builds.yml
    with:
      image-set: cpu
  gpu-build:
    if: github.event_name != 'pull_request' || vars.SKIPPY_DEPOT_RUNNERS_ENABLED != 'true'
    uses: ./.github/workflows/ci-image-builds.yml
    with:
      image-set: gpu
  cpu-publish:
    name: Publish tested CPU image
    needs: cpu-build
    if: >-
      github.repository == 'Mesh-LLM/skippy' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.build_only))
    runs-on: ${{ vars.SKIPPY_DEPOT_RUNNERS_ENABLED == 'true' && 'depot-ubuntu-24.04-4' || 'ubuntu-24.04' }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.cpu-build.outputs.cpu-artifact-id }}
          path: image
      - name: Load and verify tested image
        env:
          EXPECTED_IMAGE_ID: ${{ needs.cpu-build.outputs.cpu-image-id }}
        run: |
          set -euo pipefail
          docker image load --input image/skippy-ci-cpu.tar
          test "$(docker image inspect --format '{{.Id}}' skippy-ci-cpu:build)" = "$EXPECTED_IMAGE_ID"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' skippy-ci-cpu:build)" = "$GITHUB_SHA"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable build and latest
        run: |
          set -euo pipefail
          image=ghcr.io/mesh-llm/skippy-ci-cpu
          build_tag="build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker image tag skippy-ci-cpu:build "$image:$build_tag"
          docker image push "$image:$build_tag"
          docker image tag skippy-ci-cpu:build "$image:latest"
          docker image push "$image:latest"
  gpu-publish:
    name: Publish tested ${{ matrix.backend }} image (${{ matrix.arch }})
    needs: gpu-build
    if: >-
      github.repository == 'Mesh-LLM/skippy' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.build_only))
    runs-on: >-
      ${{ matrix.arch == 'arm64' && (vars.SKIPPY_DEPOT_RUNNERS_ENABLED == 'true' && 'depot-ubuntu-24.04-arm-4' || 'ubuntu-24.04-arm') ||
          (vars.SKIPPY_DEPOT_RUNNERS_ENABLED == 'true' && 'depot-ubuntu-24.04-4' || 'ubuntu-24.04') }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.gpu-build.outputs.gpu-matrix) }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free unused runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: skippy-ci-${{ matrix.backend }}-${{ matrix.arch }}-${{ github.run_id }}
          path: image
      - name: Load and verify tested image
        env:
          BACKEND: ${{ matrix.backend }}
          ARCH: ${{ matrix.arch }}
          TOOLKIT_VERSION: ${{ matrix.toolkit_version }}
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker image load --input "image/skippy-ci-$BACKEND.tar.gz"
          image="skippy-ci-$BACKEND:build"
          test "$(docker image inspect --format '{{.Id}}' "$image")" = "$(cat "image/skippy-ci-$BACKEND.id")"
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image")" = "linux/$ARCH"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image")" = "$SOURCE_REVISION"
          test "$(docker image inspect --format '{{index .Config.Labels "io.skippy.ci.backend"}}' "$image")" = "$BACKEND"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}}' "$image")" = "$TOOLKIT_VERSION"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable build and latest
        env:
          BACKEND: ${{ matrix.backend }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          image="ghcr.io/mesh-llm/skippy-ci-$BACKEND"
          build_tag="build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          latest_tag=latest
          if [[ "$ARCH" == arm64 ]]; then
            build_tag+=-arm64
            latest_tag+=-arm64
          fi
          docker image tag "skippy-ci-$BACKEND:build" "$image:$build_tag"
          docker image push "$image:$build_tag"
          docker image tag "skippy-ci-$BACKEND:build" "$image:$latest_tag"
          docker image push "$image:$latest_tag"
