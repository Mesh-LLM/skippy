name: Vulkan rehearsal
'on':
  push:
    branches:
    - rehearsal/vulkan-ci
  workflow_dispatch: {}
permissions:
  contents: read
  packages: read
concurrency:
  group: skippy-vulkan-rehearsal-${{ github.run_id }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_PROFILE_RELEASE_DEBUG: '0'
  CARGO_PROFILE_BENCH_DEBUG: '0'
  SCCACHE_GHA_ENABLED: 'true'
  SKIPPY_REQUIRE_SCCACHE: '1'
  SKIPPY_CUDA_ARCHITECTURE_MODE: release
  SKIPPY_CI_SOURCE_REF: ${{ github.sha }}
  SKIPPY_ARTIFACT_SCOPE: release
  SKIPPY_POSTHOG_KEY: ''
  SKIPPY_CI_PROFILE: full
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: github.repository == 'Mesh-LLM/skippy' && github.ref == 'refs/heads/rehearsal/vulkan-ci'
    permissions:
      contents: read
      packages: read
    outputs:
      profile: full
      registry-owner: mesh-llm
      cuda13_digest: ${{ steps.image.outputs.digest }}
    steps:
    - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
      with:
        script: 'const { data } = await github.rest.repos.getCollaboratorPermissionLevel({...context.repo, username: context.actor});

          if (![''admin'',''maintain'',''write''].includes(data.permission)) throw new Error(''Rehearsal requires a repository writer'');'
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
    - uses: ./.github/actions/setup
      with:
        cache: 'false'
    - run: just ci-plan
    - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - id: image
      run: 'set -euo pipefail

        manifest=$(docker buildx imagetools inspect ghcr.io/mesh-llm/skippy-ci-cuda13:latest)

        digest=$(awk ''$1 == "Digest:" {print $2; exit}'' <<< "$manifest")

        [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]

        echo "digest=$digest" >> "$GITHUB_OUTPUT"

        '
  quality:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
    - uses: ./.github/actions/setup
      with:
        cache: 'false'
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version: 22.23.0
        package-manager-cache: false
    - run: just ci-automation-setup "$RUNNER_TEMP/automation"
    - run: just ci-automation
  package_linux_x86_64_cpu:
    name: "Build, package, and smoke \xB7 Linux x64 CPU"
    needs:
    - plan
    - quality
    if: needs.plan.outputs.profile == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      SKIPPY_CI_PROFILE: ${{ needs.plan.outputs.profile }}
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        ref: ${{ env.SKIPPY_CI_SOURCE_REF }}
        persist-credentials: false
    - uses: ./.github/actions/ci-package
      with:
        runtime-id: linux-x86_64-cpu
        host-id: linux-x86_64
        build-cli: 'true'
        setup-host: 'true'
  package_windows_x86_64_cpu:
    name: "Build and verify archive \xB7 Windows x64 CPU"
    needs:
    - plan
    - quality
    if: needs.plan.outputs.profile == 'full'
    runs-on: windows-2022
    timeout-minutes: 240
    env:
      SKIPPY_CI_PROFILE: ${{ needs.plan.outputs.profile }}
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        ref: ${{ env.SKIPPY_CI_SOURCE_REF }}
        persist-credentials: false
    - uses: ./.github/actions/ci-package
      with:
        runtime-id: windows-x86_64-cpu
        host-id: windows-x86_64
        build-cli: 'true'
        setup-host: 'true'
        smoke: artifact
  package_linux_x86_64_vulkan:
    name: "Build and verify archive \xB7 Linux x64 Vulkan"
    needs:
    - plan
    - quality
    - package_linux_x86_64_cpu
    if: needs.plan.outputs.profile == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      SKIPPY_CI_PROFILE: ${{ needs.plan.outputs.profile }}
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        ref: ${{ env.SKIPPY_CI_SOURCE_REF }}
        persist-credentials: false
    - uses: ./.github/actions/ci-package
      with:
        runtime-id: linux-x86_64-vulkan
        host-id: linux-x86_64
        smoke: artifact
        vulkan-version: 1.4.328.1
        setup-host: 'true'
  package_windows_x86_64_vulkan:
    name: "Build and verify archive \xB7 Windows x64 Vulkan"
    needs:
    - plan
    - quality
    - package_windows_x86_64_cpu
    if: needs.plan.outputs.profile == 'full'
    runs-on: windows-2022
    timeout-minutes: 240
    env:
      SKIPPY_CI_PROFILE: ${{ needs.plan.outputs.profile }}
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        ref: ${{ env.SKIPPY_CI_SOURCE_REF }}
        persist-credentials: false
    - uses: ./.github/actions/ci-package
      with:
        runtime-id: windows-x86_64-vulkan
        host-id: windows-x86_64
        setup-host: 'true'
        smoke: artifact
        vulkan-version: 1.4.328.1
  verify:
    needs:
    - plan
    - quality
    - package_linux_x86_64_vulkan
    - package_windows_x86_64_vulkan
    - smoke_linux_x86_64_vulkan_nvidia
    - smoke_linux_x86_64_vulkan_amd
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      REHEARSAL_RESULTS: ${{ toJSON(needs) }}
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
    - uses: ./.github/actions/setup
      with:
        cache: 'false'
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        pattern: release-product-*
        path: rehearsal-artifacts
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        pattern: release-device-evidence-*
        path: rehearsal-artifacts
    - run: just ci-vulkan-rehearsal-verify
    - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: vulkan-rehearsal-receipt
        path: rehearsal.json
        if-no-files-found: error
        retention-days: 30
  smoke_linux_x86_64_vulkan_nvidia:
    name: Vulkan GPU smoke · Linux x64 · nvidia
    needs: [plan, package_linux_x86_64_vulkan]
    if: needs.plan.outputs.profile == 'full'
    runs-on:
      group: jy-rnr_p0zx3thw895vrka
      labels: [self-hosted, skippy-ephemeral, Linux, X64, runtime-image, cuda13]
    permissions:
      contents: read
      packages: read
    # This pool already runs inside its pinned GPU image, without a Docker socket.
    timeout-minutes: 40
    env:
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,graphics
      SKIPPY_CI_VULKAN_VENDOR: nvidia
      TAR_OPTIONS: --no-same-owner
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.SKIPPY_CI_SOURCE_REF }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache: 'false'
      - name: Provision Vulkan loader and device inspection
        run: bash scripts/ci-vulkan-runtime.sh
      - uses: ./.github/actions/ci-smoke
        with:
          runtime_id: linux-x86_64-vulkan
          download-package: 'true'
          evidence-suffix: -nvidia
      - name: Upload Vulkan setup failure evidence
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ env.SKIPPY_ARTIFACT_SCOPE }}-vulkan-setup-nvidia
          path: target/ci-evidence/vulkan-runtime.log
          if-no-files-found: warn
          retention-days: 14
  smoke_linux_x86_64_vulkan_amd:
    name: "Vulkan GPU smoke \xB7 Linux x64 \xB7 amd"
    needs:
    - plan
    - package_linux_x86_64_vulkan
    if: needs.plan.outputs.profile == 'full'
    runs-on:
      group: jy-rnr_gsxt2m73mgpcbbh
      labels:
      - self-hosted
      - skippy-ephemeral
      - Linux
      - X64
      - rocm
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/${{ needs.plan.outputs.registry-owner }}/skippy-ci-cuda13@${{ needs.plan.outputs.cuda13_digest }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user 0 --device=/dev/dri --env NVIDIA_DRIVER_CAPABILITIES=compute,utility,graphics --cpus=8 --memory=16g --pids-limit=4096
    timeout-minutes: 40
    env:
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,graphics
      SKIPPY_CI_VULKAN_VENDOR: amd
      TAR_OPTIONS: --no-same-owner
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        ref: ${{ env.SKIPPY_CI_SOURCE_REF }}
        persist-credentials: false
    - uses: ./.github/actions/rocm-workspace
    - name: Trust the host-owned checkout inside the job container
      shell: bash
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
    - name: Provision Vulkan loader and device inspection
      run: bash scripts/ci-vulkan-runtime.sh
    - uses: ./.github/actions/ci-smoke
      with:
        runtime_id: linux-x86_64-vulkan
        download-package: 'true'
        evidence-suffix: -amd
    - name: Upload Vulkan setup failure evidence
      if: failure()
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: ${{ env.SKIPPY_ARTIFACT_SCOPE }}-vulkan-setup-amd
        path: target/ci-evidence/vulkan-runtime.log
        if-no-files-found: warn
        retention-days: 14
