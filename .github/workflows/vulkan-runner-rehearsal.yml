name: Vulkan runner rehearsal
on:
  push:
    branches: [rehearsal/vulkan-sdk]
permissions:
  contents: read
jobs:
  nvidia:
    name: Vulkan NVIDIA runner probe
    if: github.repository == 'Mesh-LLM/skippy' && github.ref == 'refs/heads/rehearsal/vulkan-sdk'
    runs-on:
      group: jy-rnr_p0zx3thw895vrka
      labels: [self-hosted, skippy-ephemeral, Linux, X64, runtime-image, cuda13]
    timeout-minutes: 10
    steps:
      - name: Verify native NVIDIA runner visibility
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)/$(uname -m)" = Linux/x86_64
          nvidia-smi --query-gpu=name,driver_version --format=csv,noheader
          id -u
          command -v just
          command -v vulkaninfo
          printf 'Capabilities: %s\nLibrary path: %s\n' "${NVIDIA_DRIVER_CAPABILITIES:-unset}" "${LD_LIBRARY_PATH:-unset}"
          printf 'ICD override: %s %s\n' "${VK_DRIVER_FILES:-unset}" "${VK_ICD_FILENAMES:-unset}"
          ldconfig -p | grep -E 'vulkan|GLX_nvidia|glvkspirv|gpucomp|libEGL' || true
          sudo -n apt-get update
          sudo -n apt-get install -y --no-install-recommends libegl1
          for path in /etc/vulkan/icd.d/*.json /usr/share/vulkan/icd.d/*.json; do
            test -f "$path" || continue
            printf '%s\n' "$path"
            cat "$path"
          done
          for path in /usr/lib/x86_64-linux-gnu/libGLX_nvidia.so.0 /usr/local/nvidia/lib64/libGLX_nvidia.so.0; do
            test -f "$path" || continue
            readlink -f "$path"
            ldd "$path"
          done
          VK_LOADER_DEBUG=error,warn,driver vulkaninfo --summary
