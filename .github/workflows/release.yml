name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: skippy-release-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_PROFILE_RELEASE_DEBUG: '0'
  CARGO_PROFILE_BENCH_DEBUG: '0'
jobs:
  admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      source: ${{ steps.admit.outputs.source }}
      prerelease: ${{ steps.admit.outputs.prerelease }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - id: admit
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: just check-release "$RELEASE_TAG"
  validation:
    needs: admission
    uses: ./.github/workflows/ci.yml
    with:
      artifact_scope: release
      cuda_architecture_mode: release
  publish:
    needs: [admission, validation]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.admission.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-product-*
          path: release-artifacts
      - name: Verify complete release matrix
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: just release-prepare "$RELEASE_TAG" release-artifacts
      - name: Read existing releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release list --limit 1000 --json tagName,isDraft > release-index.json
      - id: existing
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: just automation-run release select "$RELEASE_TAG" release-index.json
      - name: Create source-bound private draft
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_SHA: ${{ needs.admission.outputs.source }}
          PRERELEASE: ${{ needs.admission.outputs.prerelease }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease="$PRERELEASE" --title "Skippy $RELEASE_TAG" --notes "Skippy source: $SOURCE_SHA"
      - name: Read immutable draft asset identities
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > remote-release.json
      - name: Admit existing assets and select missing uploads
        run: just automation-run release upload-plan dist/release remote-release.json
      - name: Upload only missing verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          while IFS= read -r asset; do
            gh release upload "$RELEASE_TAG" "$asset"
          done < release-upload.txt
      - name: Download published bytes for independent checksum verification
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release download "$RELEASE_TAG" --dir downloaded-release
      - run: just release-verify downloaded-release
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.admission.outputs.prerelease }}
        run: gh release edit "$RELEASE_TAG" --draft=false --prerelease="$PRERELEASE"
