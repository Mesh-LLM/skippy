name: Windows GPU rehearsal
on:
  # Branch-only rehearsal while the PR is open; remove this workflow before
  # integrating qualified Windows smoke into the shared CI implementation.
  push:
    branches: [rehearsal/windows-gpu-smoke]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-gpu-rehearsal-${{ github.ref }}
  cancel-in-progress: false
env:
  SKIPPY_CI_PROFILE: full
  SKIPPY_ARTIFACT_SCOPE: windows-rehearsal
  SKIPPY_CI_SOURCE_REF: ${{ github.sha }}
  WINDOWS_RECIPE_SHA: ec4469e0a18c35bb9599a9a524be47bf47e98dd5
jobs:
  task_syntax:
    name: Parse Windows smoke task
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Parse with Windows PowerShell 5.1
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            "$env:GITHUB_WORKSPACE/scripts/ci-windows-vm-task.ps1", [ref]$tokens, [ref]$errors)
          if ($errors.Count) { throw ($errors -join "`n") }
  admission:
    name: Admit Windows rehearsal configuration
    if: github.repository == 'Mesh-LLM/skippy' && github.ref == 'refs/heads/rehearsal/windows-gpu-smoke'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify repository writer and required host configuration
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          CUDA_GROUP: ${{ vars.SKIPPY_WINDOWS_CUDA_REHEARSAL_GROUP }}
          ROCM_GROUP: ${{ vars.SKIPPY_WINDOWS_ROCM_REHEARSAL_GROUP }}
          CUDA_PROFILE: ${{ vars.SKIPPY_WINDOWS_CUDA_REHEARSAL_PROFILE }}
          ROCM_PROFILE: ${{ vars.SKIPPY_WINDOWS_ROCM_REHEARSAL_PROFILE }}
        with:
          script: |
            const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
              ...context.repo, username: context.actor,
            });
            if (!['write', 'maintain', 'admin'].includes(data.permission)) {
              throw new Error('The rehearsal requires a repository writer');
            }
            for (const backend of ['CUDA', 'ROCM']) {
              if (!process.env[`${backend}_GROUP`]) {
                throw new Error(`${backend}: configure the repository-scoped native JY rehearsal pool`);
              }
              const profile = JSON.parse(process.env[`${backend}_PROFILE`] || '{}');
              for (const key of ['base', 'driver', 'driver_sha256', 'gpu', 'work_root', 'lifecycle_manager']) {
                if (typeof profile[key] !== 'string' || !profile[key] || /[\r\n]/.test(profile[key])) {
                  throw new Error(`${backend}: Windows rehearsal profile is missing ${key}`);
                }
              }
              if (!/^[a-f0-9]{64}$/.test(profile.driver_sha256)) {
                throw new Error(`${backend}: driver_sha256 must pin the supplied Windows installer`);
              }
            }
  windows_cpu:
    name: Build Windows shared CLI
    needs: [admission, task_syntax]
    runs-on: windows-2022
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-package
        with:
          runtime-id: windows-x86_64-cpu
          host-id: windows-x86_64
          build-cli: 'true'
          setup-host: 'true'
          smoke: artifact
  windows_products:
    name: Build Windows ${{ matrix.variant }} archive
    needs: windows_cpu
    runs-on: windows-2022
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: cuda12
            cuda: '12.9.2'
            rocm: ''
          - variant: cuda13
            cuda: '13.1.2'
            rocm: ''
          - variant: rocm
            cuda: ''
            rocm: '7.2.0'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-package
        with:
          runtime-id: windows-x86_64-${{ matrix.variant }}
          host-id: windows-x86_64
          setup-host: 'true'
          smoke: artifact
          windows-cuda: ${{ matrix.cuda }}
          windows-rocm: ${{ matrix.rocm }}
  windows_smoke:
    name: Windows VM smoke · ${{ matrix.backend }}
    needs: windows_products
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        backend: [cuda, rocm]
    runs-on:
      group: ${{ matrix.backend == 'cuda' && vars.SKIPPY_WINDOWS_CUDA_REHEARSAL_GROUP || vars.SKIPPY_WINDOWS_ROCM_REHEARSAL_GROUP || 'windows-rehearsal-unconfigured' }}
      labels: [self-hosted, Linux, X64, windows-vm-rehearsal, '${{ matrix.backend }}']
    env:
      WINDOWS_BACKEND: ${{ matrix.backend }}
      WINDOWS_HOST_PROFILE: ${{ matrix.backend == 'cuda' && vars.SKIPPY_WINDOWS_CUDA_REHEARSAL_PROFILE || vars.SKIPPY_WINDOWS_ROCM_REHEARSAL_PROFILE }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache: 'false'
      - name: Restore the exact public Windows recipe
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: Mesh-LLM/mesh-llm-runner-images
          ref: ${{ env.WINDOWS_RECIPE_SHA }}
          path: target/windows-recipe
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: matrix.backend == 'cuda'
        with:
          name: windows-rehearsal-product-windows-x86_64-cuda12
          path: target/windows-input/products/windows-x86_64-cuda12
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: matrix.backend == 'cuda'
        with:
          name: windows-rehearsal-product-windows-x86_64-cuda13
          path: target/windows-input/products/windows-x86_64-cuda13
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: matrix.backend == 'rocm'
        with:
          name: windows-rehearsal-product-windows-x86_64-rocm
          path: target/windows-input/products/windows-x86_64-rocm
      - name: Admit the pinned Qwen3 fixture
        run: just ci-model-fetch
        shell: bash
      - name: Rehearse exact Windows packages with real GPU offload
        run: bash scripts/ci-windows-vm-rehearsal.sh
        shell: bash
      - name: Retain VM and smoke evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: windows-rehearsal-${{ matrix.backend }}-evidence
          path: target/windows-evidence
          if-no-files-found: warn
          retention-days: 14
