# Used with dorny/paths-filter's some-with-excludes predicate.
# These are file-level rules: inline tests and shared manifest/Justfile edits
# still count when their containing file matches.
code:
  - 'crates/**'
  - 'skippy-api-rs/**'
  - 'skippy_api/**'
  - 'llama_cpp/**'
  - 'tools/**'
  - 'scripts/**'
  - '.cargo/**'
  - 'Cargo.toml'
  - 'Cargo.lock'
  - 'rust-toolchain.toml'
  - 'Justfile'
  - 'ci/targets.json'
  - 'ci/llama-canary/**'
  - '!**/*.md'
  - '!**/*.mdx'
  - '!**/*.rst'
  - '!**/*.adoc'
  - '!**/docs/**'
  - '!docs-site/**'

docs:
  - 'docs-site/**'

inference:
  - 'crates/**'
  - 'skippy_api/src/**'
  - 'skippy_api/include/**'
  - 'skippy_api/CMakeLists.txt'
  - 'llama_cpp/upstream.txt'
  - 'llama_cpp/whisper-upstream.txt'
  - 'llama_cpp/patches/**'
  - 'tools/process-supervision/**'
  - 'tools/xtask/src/main.rs'
  - 'tools/xtask/src/command.rs'
  - 'tools/xtask/src/execution.rs'
  - 'tools/xtask/src/artifact.rs'
  - 'tools/xtask/src/inference.rs'
  - 'tools/xtask/src/inference/execute.rs'
  - 'tools/xtask/src/inference/execute/**'
  - 'tools/xtask/src/inference/artifacts.rs'
  - 'tools/xtask/src/inference/build.rs'
  - 'tools/xtask/src/inference/gpu.rs'
  - 'tools/xtask/src/inference/provenance.rs'
  - 'tools/xtask/src/inference/smoke.rs'
  - 'scripts/build-llama.sh'
  - 'scripts/prepare-llama.sh'
  - 'scripts/prepare-whisper.sh'
  - 'scripts/cargo-linker*'
  - 'scripts/lib/cuda-toolkit.sh'
  - 'scripts/lib/lld.sh'
  - 'scripts/lib/macos-deployment-target*'
  - '.gi/templates.yaml'
  - 'ci/inference-ladder.json'
  - 'ci/inference-artifacts.json'
  - 'ci/inference-quality.json'
  - 'Cargo.toml'
  - 'Cargo.lock'
  - 'tools/xtask/Cargo.toml'
  - '.cargo/**'
  - 'rust-toolchain.toml'
  - 'Justfile'
  - '!**/*.md'
  - '!**/*.mdx'
  - '!**/*.rst'
  - '!**/*.adoc'
  - '!**/docs/**'
  - '!**/tests/**'
  - '!**/benches/**'
  - '!**/examples/**'
  - '!**/fuzz/**'
  - '!**/tests.rs'
  - '!**/*_tests.rs'
  - '!**/tests_*.rs'
  - '!**/test_support.rs'
  - '!crates/llama-spec-bench/**'
  - '!crates/metrics-server/**'
  - '!crates/skippy-gpu-bench/**'
  - '!crates/skippy-package-builder/**'
  - '!crates/skippy-quantize/**'
  - '!crates/skippy-correctness/**'
