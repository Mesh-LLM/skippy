  - 'crates/**'
  - 'skippy-api-rs/**'
  - 'skippy_api/**'
  - 'llama_cpp/**'
  - 'tools/**'
  - 'scripts/**'
  - '.cargo/**'
  - '.github/actions/**'
  - '.github/scripts/**'
  - '.github/path-filters.yml'
  - '.github/workflows/ci.yml'
  - '.github/workflows/ci-pr.yml'
  - '.github/workflows/inference.yml'
  - '.github/workflows/llama-upgrade.yml'
  - 'Cargo.toml'
  - 'Cargo.lock'
  - 'rust-toolchain.toml'
  - 'Justfile'
  - 'ci/targets.json'
  - 'ci/llama-canary/**'
  - '!**/*.md'
  - '!**/*.mdx'
  - '!**/*.rst'
  - '!**/*.adoc'
  - '!**/docs/**'
  - '!docs-site/**'

