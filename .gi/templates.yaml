{
  "version": 1,
  "templates": [
    {
      "name": "Native Spark inference qualification",
      "group": "Inference",
      "target": {
        "executor": "lab",
        "selector": {
          "os": {
            "family": "linux"
          },
          "arch": {
            "in": [
              "aarch64"
            ]
          },
          "accelerator": {
            "backend": "cuda",
            "model": {
              "in": [
                "NVIDIA GB10"
              ]
            }
          },
          "memory": {
            "system_gib": {
              "min": 120
            }
          },
          "network": {
            "in": [
              "james-lab"
            ]
          }
        }
      },
      "build": "cd ${repo_dir} && just inference-build",
      "inputs": [
        {
          "key": "profile",
          "label": "Profile",
          "kind": "choice",
          "choices": [
            {
              "value": "pr",
              "label": "pr"
            },
            {
              "value": "nightly",
              "label": "nightly"
            },
            {
              "value": "release",
              "label": "release"
            }
          ],
          "default": "pr"
        },
        {
          "key": "model_key",
          "label": "Model",
          "kind": "choice",
          "choices": [
            {
              "value": "qwen35-08b",
              "label": "Qwen/Qwen3.5-0.8B"
            },
            {
              "value": "qwen35-2b",
              "label": "Qwen/Qwen3.5-2B"
            },
            {
              "value": "qwen35-4b",
              "label": "Qwen/Qwen3.5-4B"
            },
            {
              "value": "qwen35-9b",
              "label": "Qwen/Qwen3.5-9B"
            },
            {
              "value": "qwen38-27b",
              "label": "Qwen/Qwen3.8-27B"
            },
            {
              "value": "qwen3-coder-30b-a3b",
              "label": "Qwen/Qwen3-Coder-30B-A3B-Instruct"
            },
            {
              "value": "qwen36-35b-a3b",
              "label": "Qwen/Qwen3.6-35B-A3B"
            },
            {
              "value": "qwen38-flash-next",
              "label": "Qwen/Qwen3.8-Flash-Next"
            }
          ],
          "default": "qwen35-4b"
        },
        {
          "key": "model",
          "label": "Model name",
          "kind": "choice",
          "choices": [
            {
              "value": "Qwen3.5-0.8B",
              "label": "Qwen/Qwen3.5-0.8B"
            },
            {
              "value": "Qwen3.5-2B",
              "label": "Qwen/Qwen3.5-2B"
            },
            {
              "value": "Qwen3.5-4B",
              "label": "Qwen/Qwen3.5-4B"
            },
            {
              "value": "Qwen3.5-9B",
              "label": "Qwen/Qwen3.5-9B"
            },
            {
              "value": "Qwen3.8-27B",
              "label": "Qwen/Qwen3.8-27B"
            },
            {
              "value": "Qwen3-Coder-30B-A3B-Instruct",
              "label": "Qwen/Qwen3-Coder-30B-A3B-Instruct"
            },
            {
              "value": "Qwen3.6-35B-A3B",
              "label": "Qwen/Qwen3.6-35B-A3B"
            },
            {
              "value": "Qwen3.8-Flash-Next",
              "label": "Qwen/Qwen3.8-Flash-Next"
            }
          ],
          "default": "Qwen3.5-4B"
        }
      ],
      "budget": {
        "max_usd": 0,
        "max_duration_s": 21600,
        "grace_s": 60
      },
      "retain": "never",
      "key": "inference-standalone",
      "command": "cd \"$JIANYANG_REPO_DIR\" && just inference-execute ${profile} ${model_key} standalone"
    },
