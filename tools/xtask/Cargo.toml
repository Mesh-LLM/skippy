[package]
name = "xtask"
version.workspace = true
edition = "2024"
publish = false
description = "Skippy native build, certification, and release automation"

[dependencies]
process-supervision = { path = "../process-supervision" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
hex = "0.4"
thiserror = "2"
getrandom = "0.3"
goblin = "=0.8.2"
toml = "0.9"
tar = "0.4"
flate2 = "1"
tempfile = "3"
semver = "=1.0.28"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tokio = { version = "1", features = ["rt", "net", "time", "macros"] }
caseless = "0.2"
unicode-normalization = "0.1"
base64 = "0.22"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]

[[example]]
name = "migration_patch_fixture"
path = "examples/migration_patch_fixture.rs"
